# Nederlandse beschrijvingen voor de eigenschapsbijdragen van de devtools inspector.
# Sleutelformaat: props.<FeatureType>.desc
props.AccordionMultiple.desc=Staat toe dat meer dan één accordeonpaneel tegelijk open blijft.
props.AccordionPanelLabel.desc=Stelt de tekst in die in de header van het accordeonpaneel wordt getoond.

props.AlertClosable.desc=Toont een sluitknop waarmee de gebruiker de alert kan wegklikken.

props.AnchorHref.desc=Stelt de URL in waar de link naartoe navigeert.
props.AnchorTarget.desc=Stelt in waar de gelinkte URL wordt geopend, zoals _self of _blank.

props.AppLayoutDrawerFooterVisible.desc=Toont de footersectie in de drawer.
props.AppLayoutDrawerHeaderVisible.desc=Toont de headersectie in de drawer.
props.AppLayoutDrawerOpened.desc=Bepaalt of de drawer op dit moment open is.
props.AppLayoutDrawerOverlay.desc=Rendert de drawer als een overlay boven de content in plaats van die opzij te duwen.
props.AppLayoutDrawerPlacement.desc=Stelt in vanaf welke rand van de layout de drawer opent.
props.AppLayoutDrawerPopover.desc=Rendert de drawer als een zwevende popover in plaats van als een gedokt paneel.
props.AppLayoutFooterFixed.desc=Houdt de footer op zijn plaats terwijl de content scrollt.
props.AppLayoutFooterOffscreen.desc=Verplaatst de footer buiten beeld zodat hij verborgen is tot hij wordt getoond.
props.AppLayoutFooterReveal.desc=Toont de footer automatisch terwijl de gebruiker scrollt.
props.AppLayoutFooterShadow.desc=Stelt in wanneer de footer een schaduw over de content werpt: never, on scroll of always.
props.AppLayoutHeaderFixed.desc=Houdt de header op zijn plaats terwijl de content scrollt.
props.AppLayoutHeaderOffscreen.desc=Verplaatst de header buiten beeld zodat hij verborgen is tot hij wordt getoond.
props.AppLayoutHeaderReveal.desc=Toont de header automatisch terwijl de gebruiker scrollt.
props.AppLayoutHeaderShadow.desc=Stelt in wanneer de header een schaduw over de content werpt: never, on scroll of always.

props.AppNavAutoOpen.desc=Opent automatisch de navigatiegroep die de actieve route bevat.
props.AppNavItemPinKey.desc=Stelt een expliciete sleutel in om de pinstatus van dit item over herladingen heen te bewaren.
props.AppNavItemPinned.desc=Bepaalt of dit navigatie-item aan de pinsectie is vastgezet.
props.AppNavPinningAutosave.desc=Bewaart vastgezette navigatie-items automatisch over sessies heen.
props.AppNavPinningEnabled.desc=Staat gebruikers toe navigatie-items vast te zetten en los te maken.
props.AppNavPinningTitle.desc=Stelt de titel in die boven de vastgezette navigatiesectie wordt getoond.
props.AppNavPinningTouchVisible.desc=Toont de pinbediening op touchapparaten.
props.AppNavSearchEmptyMessage.desc=Stelt het bericht in dat wordt getoond wanneer een navigatiezoekopdracht geen resultaten oplevert.
props.AppNavSearchFieldVisible.desc=Toont het zoekveld in het navigatiepaneel.
props.AppNavSearchPlaceholder.desc=Stelt de placeholdertekst in die in het navigatiezoekveld wordt getoond.

props.AvatarInitials.desc=Stelt de initialen in die worden getoond wanneer de avatar geen afbeelding heeft.
props.AvatarShape.desc=Stelt de omtrekvorm van de avatar in.

props.BadgeLabel.desc=Stelt de tekst in die in de badge wordt getoond.

props.ButtonDisableOnClick.desc=Schakelt de knop automatisch uit direct nadat erop is geklikt.
props.ButtonName.desc=Stelt de toegankelijke naam in die voor de knop wordt gebruikt wanneer het label alleen een icoon is.

props.CardBorderless.desc=Verwijdert de rand die rond de kaart wordt getekend.
props.CardDivided.desc=Tekent scheidingslijnen tussen de kop, de inhoud en de voet van de kaart.
props.CardOrientation.desc=Bepaalt of de afbeelding van de kaart boven de andere gebieden staat of ernaast wordt geplaatst.
props.CardShadow.desc=Stelt de schaduw in die de hoogte van de kaart weergeeft.

props.CheckBoxChecked.desc=Bepaalt of het selectievakje aangevinkt is.
props.CheckBoxIndeterminate.desc=Toont het selectievakje in een onbepaalde (deels aangevinkte) visuele staat.

props.ColumnsLayoutBreakpoints.desc=Stelt de responsive breakpoints in die bepalen hoeveel kolommen de layout bij elke breedte rendert.
props.ColumnsLayoutHorizontalAlignment.desc=Stelt in hoe items horizontaal binnen hun kolommen worden uitgelijnd.
props.ColumnsLayoutHorizontalSpacing.desc=Stelt de horizontale ruimte tussen kolommen in.
props.ColumnsLayoutItemColumn.desc=Stelt in in welke kolom dit item wordt geplaatst.
props.ColumnsLayoutItemHorizontalAlignment.desc=Overschrijft de horizontale uitlijning van dit item binnen zijn kolom.
props.ColumnsLayoutItemSpan.desc=Stelt in over hoeveel kolommen dit item zich uitstrekt.
props.ColumnsLayoutItemVerticalAlignment.desc=Overschrijft de verticale uitlijning van dit item binnen zijn kolom.
props.ColumnsLayoutVerticalAlignment.desc=Stelt in hoe items verticaal binnen hun kolommen worden uitgelijnd.
props.ColumnsLayoutVerticalSpacing.desc=Stelt de verticale ruimte tussen rijen in.

props.ComboBoxAllowCustomValue.desc=Staat de gebruiker toe een waarde te typen die niet in de lijst met opties staat.

props.DialogAlignment.desc=Stelt in waar de dialog op het scherm wordt geplaatst.
props.DialogAutoWidth.desc=Past de breedte van de dialog automatisch aan de content aan.
props.DialogBackdrop.desc=Toont een gedimde achtergrondlaag achter de dialog terwijl deze open is.
props.DialogBlurred.desc=Vervaagt de content achter de backdrop van de dialog.
props.DialogCancelOnEscKey.desc=Sluit de dialog wanneer de gebruiker op de Escape-toets drukt.
props.DialogCancelOnOutsideClick.desc=Sluit de dialog wanneer de gebruiker erbuiten klikt.
props.DialogFullscreen.desc=Vergroot de dialog tot het volledige scherm.
props.DialogMoveable.desc=Staat de gebruiker toe de dialog naar een nieuwe positie te slepen.
props.DialogPosx.desc=Stelt de horizontale positie van de dialog in.
props.DialogPosy.desc=Stelt de verticale positie van de dialog in.
props.DialogSnapToEdge.desc=Klikt de dialog vast aan de dichtstbijzijnde schermrand wanneer hij er dichtbij wordt gesleept.

props.DrawerPlacement.desc=Stelt in vanaf welke schermrand de drawer naar binnen schuift.

props.FlexItemAlignment.desc=Overschrijft hoe dit item zichzelf uitlijnt op de kruisas van de flex-layout.
props.FlexItemBasis.desc=Stelt de initiële grootte van dit item op de hoofdas in, voordat het groeit of krimpt.
props.FlexItemGrow.desc=Stelt in hoeveel dit item groeit ten opzichte van zijn siblings om extra ruimte te vullen.
props.FlexItemOrder.desc=Stelt de visuele volgorde van dit item ten opzichte van zijn siblings in.
props.FlexItemShrink.desc=Stelt in hoeveel dit item krimpt ten opzichte van zijn siblings wanneer de ruimte beperkt is.

props.FlexLayoutAlignContent.desc=Stelt in hoe gewrapte rijen of kolommen binnen de flex-layout worden verdeeld.
props.FlexLayoutAlignItems.desc=Stelt in hoe items op de kruisas van de flex-layout worden uitgelijnd.
props.FlexLayoutDirection.desc=Stelt de richting van de hoofdas in waarlangs items worden geplaatst.
props.FlexLayoutJustifyContent.desc=Stelt in hoe items langs de hoofdas van de flex-layout worden verdeeld.
props.FlexLayoutSpacing.desc=Stelt de ruimte tussen items in de flex-layout in.
props.FlexLayoutWrap.desc=Bepaalt of items over meerdere regels wrappen wanneer de ruimte opraakt.

props.HasClassName.desc=Voegt CSS-klassenamen toe aan het root-element van het component.
props.HasEnablement.desc=Schakelt gebruikersinteractie met het component in of uit.
props.HasExpanse.desc=Stelt de grootteschaal van het component in, van kleiner naar groter.
props.HasFileChooserFiltersVisible.desc=Toont het menu met bestandstypefilters in de bestandskiezer.
props.HasFileChooserMultiFilterSelection.desc=Staat toe meerdere bestandstypefilters tegelijk te selecteren in het menu van de bestandskiezer.
props.HasFileDrop.desc=Maakt het mogelijk bestanden op het component te slepen om ze te uploaden.
props.HasFileSystemAccess.desc=Staat het component toe de File System Access API van de browser te gebruiken.
props.HasHeight.desc=Stelt de hoogte van het component in.
props.HasHelperText.desc=Stelt ondersteunende hulptekst in die onder het component wordt getoond.
props.HasHighlightOnFocus.desc=Stelt in wanneer de inhoud van het component automatisch wordt geselecteerd bij focus: never, on keyboard focus of on any focus.
props.HasHorizontalAlignment.desc=Stelt de horizontale uitlijning van de inhoud van het component in.
props.HasLabel.desc=Stelt de labeltekst in die voor het component wordt getoond.
props.HasMask.desc=Stelt het invoermaskerpatroon in dat begrenst en opmaakt wat de gebruiker kan typen.
props.HasMax.desc=Stelt de maximale waarde in die het component accepteert.
props.HasMaxFileSize.desc=Stelt de maximale grootte in bytes in die voor een geüpload bestand is toegestaan.
props.HasMaxFiles.desc=Stelt het maximale aantal bestanden in dat kan worden geüpload.
props.HasMaxHeight.desc=Stelt de maximale hoogte in waartoe het component kan groeien.
props.HasMaxLength.desc=Stelt het maximale aantal tekens in dat het component accepteert.
props.HasMaxWidth.desc=Stelt de maximale breedte in waartoe het component kan groeien.
props.HasMin.desc=Stelt de minimale waarde in die het component accepteert.
props.HasMinHeight.desc=Stelt de minimale hoogte in waartoe het component kan krimpen.
props.HasMinLength.desc=Stelt het minimale aantal tekens in dat het component vereist.
props.HasMinWidth.desc=Stelt de minimale breedte in waartoe het component kan krimpen.
props.HasPattern.desc=Stelt een reguliere expressie in waaraan de waarde van het component moet voldoen om geldig te zijn.
props.HasPlaceholder.desc=Stelt de placeholdertekst in die wordt getoond wanneer het component geen waarde heeft.
props.HasReadOnly.desc=Verhindert dat de gebruiker de waarde van het component wijzigt, terwijl focus en selectie mogelijk blijven.
props.HasRequired.desc=Markeert het component als verplicht voor formuliervalidatie.
props.HasStep.desc=Stelt de stapgrootte in die wordt gebruikt wanneer de waarde verandert.
props.HasText.desc=Stelt de tekstinhoud in die het component toont.
props.HasTextPosition.desc=Stelt in waar de tekst wordt geplaatst ten opzichte van het icoon of de bediening van het component.
props.HasTheme.desc=Stelt het kleurthema in dat op het component wordt toegepast.
props.HasTooltip.desc=Stelt de tooltiptekst in die wordt getoond bij het zweven over het component.
props.HasVisibility.desc=Bepaalt of het component zichtbaar is.
props.HasWidth.desc=Stelt de breedte van het component in.

props.Icon.desc=Stelt het icoon in dat het component toont, gekozen uit een icon pool.

props.IframeSrc.desc=Stelt de URL van de ingesloten pagina in.

props.ImgAlt.desc=Stelt de alternatieve tekst in die wordt aangekondigd wanneer de afbeelding niet kan worden getoond.
props.ImgSrc.desc=Stelt de URL van de getoonde afbeelding in.

props.LabelWrap.desc=Staat toe dat de tekst van het label over meerdere regels wrapt in plaats van te worden afgekapt.

props.ListBoxSelectionMode.desc=Stelt in of de listbox het selecteren van één item of meerdere items toestaat.

props.ListSearchEmptyMessage.desc=Stelt het bericht in dat wordt getoond wanneer een zoekopdracht in de lijst geen resultaten oplevert.
props.ListSearchFieldVisible.desc=Toont het zoekveld boven de lijst.
props.ListSearchPlaceholder.desc=Stelt de placeholdertekst in die in het zoekveld van de lijst wordt getoond.

props.LoadingBackdropVisible.desc=Toont een gedimde achtergrondlaag achter de laadindicator.

props.LoginAutoClose.desc=Sluit de logindialog automatisch na een geslaagde aanmelding.
props.LoginAutoSignin.desc=Probeert automatisch aan te melden zonder dat de gebruiker het formulier hoeft te versturen.
props.LoginEmptyPassword.desc=Staat toe het loginformulier te versturen met een leeg wachtwoordveld.
props.LoginError.desc=Toont het loginformulier in zijn foutstaat.
props.LoginRememberme.desc=Toont een "remember me"-optie op het loginformulier.

props.NavigatorAutoDisable.desc=Schakelt navigatieknoppen automatisch uit wanneer de grenspagina is bereikt.
props.NavigatorLayout.desc=Stelt in welke navigatiebedieningen de navigator rendert: none, numbered pages, preview of quick jump.

props.PasswordFieldPasswordReveal.desc=Toont een bediening waarmee de gebruiker het getypte wachtwoord zichtbaar kan maken.

props.ProgressBarAnimated.desc=Animeert de vulling van de voortgangsbalk.
props.ProgressBarIndeterminate.desc=Toont de voortgangsbalk in een onbepaalde staat wanneer de voortgang niet te meten is.
props.ProgressBarOrientation.desc=Stelt in of de voortgangsbalk horizontaal of verticaal wordt geplaatst.
props.ProgressBarStriped.desc=Toont een streeppatroon op de vulling van de voortgangsbalk.
props.ProgressBarTextVisible.desc=Toont het voortgangspercentage als tekst op de voortgangsbalk.

props.RadioButtonActivation.desc=Stelt in of de radioknop automatisch bij focus wordt aangevinkt of alleen bij expliciete selectie.
props.RadioButtonChecked.desc=Bepaalt of de radioknop aangevinkt is.
props.RadioButtonSwitch.desc=Rendert de radioknop als een toggle switch in plaats van als de standaard radiobediening.

props.SelectDropdownMaxRowCount.desc=Stelt het maximale aantal rijen in dat in de geopende dropdownlijst wordt getoond voordat deze scrollt.
props.SelectDropdownOpenHeight.desc=Stelt de hoogte van het dropdownlijstpaneel in wanneer het open is.
props.SelectDropdownOpenWidth.desc=Stelt de breedte van het dropdownlijstpaneel in wanneer het open is.

props.SliderAllowMajorLabelsOverlap.desc=Staat toe dat labels van hoofdstreepjes overlappen in plaats van te worden verborgen om botsingen te vermijden.
props.SliderFilled.desc=Vult het spoor tussen het begin van de slider en de huidige waarde.
props.SliderInverted.desc=Keert de richting om waarin de waarde van de slider toeneemt.
props.SliderLabelsVisible.desc=Toont labels naast de streepjes van de slider.
props.SliderMajorTickSpacing.desc=Stelt het aantal waarden tussen hoofdstreepjes op de slider in.
props.SliderMinorTickSpacing.desc=Stelt het aantal waarden tussen hulpstreepjes op de slider in.
props.SliderOrientation.desc=Stelt in of de slider horizontaal of verticaal wordt geplaatst.
props.SliderSlideByClickingTicks.desc=Staat de gebruiker toe de slider te verplaatsen door direct op een streepje te klikken.
props.SliderSlideByWheel.desc=Staat de gebruiker toe de waarde van de slider met het muiswiel te wijzigen.
props.SliderSnapToTicks.desc=Klikt de waarde van de slider vast op het dichtstbijzijnde streepje.
props.SliderTicksVisible.desc=Toont streepjes langs het spoor van de slider.
props.SliderTooltipVisible.desc=Toont een tooltip met de huidige waarde tijdens het bedienen van de slider.
props.SliderTooltipVisibleOnSlideOnly.desc=Toont de waardetooltip van de slider alleen tijdens het actief slepen, niet bij zweven.

props.SpinnerClockwise.desc=Stelt de draairichting van de spinner in op met de klok mee in plaats van tegen de klok in.
props.SpinnerPaused.desc=Pauzeert de animatie van de spinner.
props.SpinnerSpeed.desc=Stelt de snelheid van de rotatie van de spinner in.

props.SplitterAutosave.desc=Bewaart de positie van de splitter over sessies heen.
props.SplitterOrientation.desc=Stelt in of de splitter zijn panelen horizontaal of verticaal verdeelt.
props.SplitterPositionRelative.desc=Stelt de positie van de splitter in als percentage tussen zijn twee panelen.

props.TabbedPaneAlignment.desc=Stelt de uitlijning van de tabs binnen de tabbalk in.
props.TabbedPaneBodyHidden.desc=Verbergt de contentbody zodat het component zich als een tabgebaseerd menu gedraagt.
props.TabbedPaneBorderless.desc=Verwijdert de rand rond de tabbed pane.
props.TabbedPaneHideActiveIndicator.desc=Verbergt de indicator die de actieve tab markeert.
props.TabbedPanePlacement.desc=Stelt in aan welke rand van de pane de tabs worden geplaatst.
props.TabbedPaneSegment.desc=Rendert de tabs als een gesegmenteerde, pilvormige bediening in plaats van als standaardtabs.
props.TabbedPaneSwipeWithMouse.desc=Staat toe tabs te wisselen door met de muis te slepen, niet alleen met touch.
props.TabbedPaneSwipeable.desc=Staat toe tabs te wisselen met een veeggebaar.

props.TableCheckboxSelection.desc=Toont in elke rij een selectievakje om deze te selecteren.
props.TableDeselection.desc=Staat de gebruiker toe een al geselecteerde rij te deselecteren.
props.TableGroupHeaderHeight.desc=Stelt de hoogte van de groepsheaderrij van de tabel in.
props.TableHeaderCheckboxSelection.desc=Toont een selectievakje in de tabelheader om alle rijen te selecteren of te deselecteren.
props.TableHeaderHeight.desc=Stelt de hoogte van de headerrij van de tabel in.
props.TableMultiSelectWithClick.desc=Staat toe meerdere rijen te selecteren met een gewone klik in plaats van met een modificatietoets.
props.TableMultiSorting.desc=Staat toe de tabel op meer dan één kolom tegelijk te sorteren.
props.TableRowHeight.desc=Stelt de hoogte van elke rij in de tabel in.
props.TableSelectionMode.desc=Stelt in of de tabel het selecteren van één rij of meerdere rijen toestaat.
props.TableStriped.desc=Wisselt de achtergrondkleur van tabelrijen af.

props.TextAreaColumns.desc=Stelt de zichtbare breedte van het tekstvlak in tekens in.
props.TextAreaHorizontalScroll.desc=Toont een horizontale scrollbalk in het tekstvlak.
props.TextAreaLineCountLimit.desc=Stelt het maximale aantal regels in dat het tekstvlak accepteert.
props.TextAreaLineWrap.desc=Wrapt lange tekstregels naar de volgende regel in plaats van horizontaal te scrollen.
props.TextAreaParagraphLengthLimit.desc=Stelt het maximale aantal tekens in dat in één alinea is toegestaan.
props.TextAreaRows.desc=Stelt de zichtbare hoogte van het tekstvlak in rijen in.
props.TextAreaVerticalScroll.desc=Toont een verticale scrollbalk in het tekstvlak.
props.TextAreaWrapStyle.desc=Stelt in of gewrapte tekst op woordgrenzen of op tekengrenzen breekt.

props.TextFieldSpellCheck.desc=Schakelt de spellingcontrole van de browser in op de inhoud van het veld.
props.TextFieldType.desc=Stelt het invoertype in dat het tekstveld accepteert, zoals text, email of password.

props.ToastDuration.desc=Stelt in hoe lang de toast zichtbaar blijft voordat hij verdwijnt.
props.ToastPlacement.desc=Stelt in waar de toast op het scherm verschijnt.

props.ToolbarCompact.desc=Vermindert de padding van de toolbar voor een compactere weergave.

props.TreeConnected.desc=Toont verbindingslijnen tussen ouder- en kindknopen in de boom.
props.TreeGroupIconsVisible.desc=Toont iconen naast groepsknopen (ouders) in de boom.
props.TreeLeafIconsVisible.desc=Toont iconen naast bladknopen (zonder kinderen) in de boom.
props.TreeSelectionMode.desc=Stelt in of de boom het selecteren van één knoop of meerdere knopen toestaat.

props.UploadAllFilesFilterEnabled.desc=Voegt een "alle bestanden"-optie toe aan het bestandstypefiltermenu van de upload.
props.UploadAutoClear.desc=Stelt in wanneer voltooide bestanden automatisch uit de bestandslijst van de upload worden verwijderd.
props.UploadAutoUpload.desc=Stelt in wanneer bestandsuploads automatisch starten: never, on selection of on drop.
props.UploadCapture.desc=Stelt in welke camera of microfoon van het apparaat de upload aan de browser moet voorstellen.
props.UploadPicker.desc=Stelt in of de bestandskiezer van de upload losse bestanden of hele mappen selecteert.
props.UploadPreset.desc=Stelt in welke uploadbedieningen zichtbaar zijn: full, inline of button only.
props.UploadSelectionMode.desc=Stelt in of de upload het selecteren van één bestand of meerdere bestanden toestaat.
