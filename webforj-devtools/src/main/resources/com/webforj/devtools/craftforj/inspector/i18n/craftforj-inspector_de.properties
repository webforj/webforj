# Deutsche Beschreibungen für die Property-Contributions des DevTools-Inspectors.
# Schlüsselformat: props.<FeatureType>.desc
props.AccordionMultiple.desc=Erlaubt, dass mehr als ein Accordion-Panel gleichzeitig geöffnet bleibt.
props.AccordionPanelLabel.desc=Legt den Text fest, der in der Kopfzeile des Accordion-Panels angezeigt wird.

props.AlertClosable.desc=Zeigt eine Schaltfläche, mit der sich die Meldung schließen lässt.

props.AnchorHref.desc=Legt die URL fest, zu der der Link navigiert.
props.AnchorTarget.desc=Legt fest, wo die verlinkte URL geöffnet wird, etwa _self oder _blank.

props.AppLayoutDrawerFooterVisible.desc=Zeigt den Fußbereich innerhalb des Drawers.
props.AppLayoutDrawerHeaderVisible.desc=Zeigt den Kopfbereich innerhalb des Drawers.
props.AppLayoutDrawerOpened.desc=Steuert, ob der Drawer aktuell geöffnet ist.
props.AppLayoutDrawerOverlay.desc=Rendert den Drawer als Overlay über dem Inhalt, statt ihn zur Seite zu schieben.
props.AppLayoutDrawerPlacement.desc=Legt fest, an welcher Kante des Layouts sich der Drawer öffnet.
props.AppLayoutDrawerPopover.desc=Rendert den Drawer als schwebendes Popover statt als angedocktes Panel.
props.AppLayoutFooterFixed.desc=Hält den Fußbereich an Ort und Stelle, während der Inhalt scrollt.
props.AppLayoutFooterOffscreen.desc=Schiebt den Fußbereich aus dem Sichtbereich, sodass er verborgen bleibt, bis er eingeblendet wird.
props.AppLayoutFooterReveal.desc=Blendet den Fußbereich beim Scrollen automatisch ein.
props.AppLayoutFooterShadow.desc=Legt fest, wann der Fußbereich einen Schatten über den Inhalt wirft: never, on scroll oder always.
props.AppLayoutHeaderFixed.desc=Hält den Kopfbereich an Ort und Stelle, während der Inhalt scrollt.
props.AppLayoutHeaderOffscreen.desc=Schiebt den Kopfbereich aus dem Sichtbereich, sodass er verborgen bleibt, bis er eingeblendet wird.
props.AppLayoutHeaderReveal.desc=Blendet den Kopfbereich beim Scrollen automatisch ein.
props.AppLayoutHeaderShadow.desc=Legt fest, wann der Kopfbereich einen Schatten über den Inhalt wirft: never, on scroll oder always.

props.AppNavAutoOpen.desc=Öffnet automatisch die Navigationsgruppe, die die aktive Route enthält.
props.AppNavItemPinKey.desc=Legt einen expliziten Schlüssel fest, unter dem der Pin-Status dieses Eintrags über Neuladen hinweg gespeichert wird.
props.AppNavItemPinned.desc=Steuert, ob dieser Navigationseintrag im Pin-Bereich angeheftet ist.
props.AppNavPinningAutosave.desc=Speichert angeheftete Navigationseinträge automatisch über Sitzungen hinweg.
props.AppNavPinningEnabled.desc=Erlaubt das Anheften und Lösen von Navigationseinträgen.
props.AppNavPinningTitle.desc=Legt den Titel über dem Bereich der angehefteten Navigationseinträge fest.
props.AppNavPinningTouchVisible.desc=Zeigt das Pin-Steuerelement auf Touch-Geräten.
props.AppNavSearchEmptyMessage.desc=Legt die Meldung fest, die angezeigt wird, wenn eine Navigationssuche keine Treffer liefert.
props.AppNavSearchFieldVisible.desc=Zeigt das Suchfeld im Navigationsbereich.
props.AppNavSearchPlaceholder.desc=Legt den Platzhaltertext im Suchfeld der Navigation fest.

props.AvatarInitials.desc=Legt die Initialen fest, die angezeigt werden, wenn der Avatar kein Bild hat.
props.AvatarShape.desc=Legt die Umrissform des Avatars fest.

props.BadgeLabel.desc=Legt den Text fest, der im Badge angezeigt wird.

props.ButtonDisableOnClick.desc=Deaktiviert die Schaltfläche automatisch direkt nach dem Klick.
props.ButtonName.desc=Legt den barrierefreien Namen der Schaltfläche fest, wenn ihre Beschriftung nur aus einem Icon besteht.

props.CardBorderless.desc=Entfernt den Rahmen, der um die Karte gezeichnet wird.
props.CardDivided.desc=Zeichnet Trennlinien zwischen Kopfbereich, Inhalt und Fußbereich der Karte.
props.CardOrientation.desc=Legt fest, ob die Abbildung der Karte über den anderen Bereichen steht oder daneben.
props.CardShadow.desc=Legt den Schatten fest, der die Höhe der Karte darstellt.

props.CheckBoxChecked.desc=Steuert, ob die Checkbox angehakt ist.
props.CheckBoxIndeterminate.desc=Zeigt die Checkbox im unbestimmten (teilweise angehakten) Zustand.

props.ColumnsLayoutBreakpoints.desc=Legt die responsiven Breakpoints fest, die bestimmen, wie viele Spalten das Layout bei welcher Breite rendert.
props.ColumnsLayoutHorizontalAlignment.desc=Legt fest, wie Elemente innerhalb ihrer Spalten horizontal ausgerichtet werden.
props.ColumnsLayoutHorizontalSpacing.desc=Legt den horizontalen Abstand zwischen den Spalten fest.
props.ColumnsLayoutItemColumn.desc=Legt fest, in welcher Spalte dieses Element platziert wird.
props.ColumnsLayoutItemHorizontalAlignment.desc=Überschreibt die horizontale Ausrichtung dieses Elements innerhalb seiner Spalte.
props.ColumnsLayoutItemSpan.desc=Legt fest, über wie viele Spalten sich dieses Element erstreckt.
props.ColumnsLayoutItemVerticalAlignment.desc=Überschreibt die vertikale Ausrichtung dieses Elements innerhalb seiner Spalte.
props.ColumnsLayoutVerticalAlignment.desc=Legt fest, wie Elemente innerhalb ihrer Spalten vertikal ausgerichtet werden.
props.ColumnsLayoutVerticalSpacing.desc=Legt den vertikalen Abstand zwischen den Zeilen fest.

props.ComboBoxAllowCustomValue.desc=Erlaubt die Eingabe eines Werts, der nicht in der Optionsliste steht.

props.DialogAlignment.desc=Legt fest, wo der Dialog auf dem Bildschirm positioniert wird.
props.DialogAutoWidth.desc=Passt die Breite des Dialogs automatisch an seinen Inhalt an.
props.DialogBackdrop.desc=Zeigt ein abgedunkeltes Overlay hinter dem geöffneten Dialog.
props.DialogBlurred.desc=Weichzeichnet den Inhalt hinter dem Backdrop des Dialogs.
props.DialogCancelOnEscKey.desc=Schließt den Dialog, wenn die Escape-Taste gedrückt wird.
props.DialogCancelOnOutsideClick.desc=Schließt den Dialog bei einem Klick außerhalb.
props.DialogFullscreen.desc=Vergrößert den Dialog auf den gesamten Bildschirm.
props.DialogMoveable.desc=Erlaubt, den Dialog an eine neue Position zu ziehen.
props.DialogPosx.desc=Legt die horizontale Position des Dialogs fest.
props.DialogPosy.desc=Legt die vertikale Position des Dialogs fest.
props.DialogSnapToEdge.desc=Rastet den Dialog an der nächsten Bildschirmkante ein, wenn er nah genug herangezogen wird.

props.DrawerPlacement.desc=Legt fest, von welcher Bildschirmkante der Drawer einfährt.

props.FlexItemAlignment.desc=Überschreibt, wie sich dieses Element auf der Querachse des Flex-Layouts ausrichtet.
props.FlexItemBasis.desc=Legt die anfängliche Größe dieses Elements auf der Hauptachse fest, bevor es wächst oder schrumpft.
props.FlexItemGrow.desc=Legt fest, wie stark dieses Element im Verhältnis zu seinen Geschwistern wächst, um freien Platz zu füllen.
props.FlexItemOrder.desc=Legt die visuelle Reihenfolge dieses Elements im Verhältnis zu seinen Geschwistern fest.
props.FlexItemShrink.desc=Legt fest, wie stark dieses Element im Verhältnis zu seinen Geschwistern schrumpft, wenn der Platz knapp wird.

props.FlexLayoutAlignContent.desc=Legt fest, wie umgebrochene Zeilen oder Spalten innerhalb des Flex-Layouts verteilt werden.
props.FlexLayoutAlignItems.desc=Legt fest, wie Elemente auf der Querachse des Flex-Layouts ausgerichtet werden.
props.FlexLayoutDirection.desc=Legt die Richtung der Hauptachse fest, entlang der die Elemente angeordnet werden.
props.FlexLayoutJustifyContent.desc=Legt fest, wie Elemente entlang der Hauptachse des Flex-Layouts verteilt werden.
props.FlexLayoutSpacing.desc=Legt den Abstand zwischen den Elementen im Flex-Layout fest.
props.FlexLayoutWrap.desc=Steuert, ob Elemente auf mehrere Zeilen umbrechen, wenn der Platz ausgeht.

props.HasClassName.desc=Fügt dem Wurzelelement der Komponente CSS-Klassennamen hinzu.
props.HasEnablement.desc=Aktiviert oder deaktiviert die Interaktion mit der Komponente.
props.HasExpanse.desc=Legt die Größenstufe der Komponente fest, von kleiner bis größer.
props.HasFileChooserFiltersVisible.desc=Zeigt das Menü der Dateityp-Filter im Dateiauswahldialog.
props.HasFileChooserMultiFilterSelection.desc=Erlaubt, im Filtermenü des Dateiauswahldialogs mehrere Dateityp-Filter gleichzeitig auszuwählen.
props.HasFileDrop.desc=Erlaubt, Dateien zum Hochladen auf die Komponente zu ziehen.
props.HasFileSystemAccess.desc=Erlaubt der Komponente, die File System Access API des Browsers zu nutzen.
props.HasHeight.desc=Legt die Höhe der Komponente fest.
props.HasHelperText.desc=Legt den ergänzenden Hilfetext unterhalb der Komponente fest.
props.HasHighlightOnFocus.desc=Legt fest, wann der Inhalt der Komponente bei Fokus automatisch hervorgehoben wird: never, on keyboard focus oder on any focus.
props.HasHorizontalAlignment.desc=Legt die horizontale Ausrichtung des Komponenteninhalts fest.
props.HasLabel.desc=Legt den Beschriftungstext der Komponente fest.
props.HasMask.desc=Legt die Eingabemaske fest, die die Eingabe einschränkt und formatiert.
props.HasMax.desc=Legt den größten Wert fest, den die Komponente annimmt.
props.HasMaxFileSize.desc=Legt die maximal zulässige Größe einer hochgeladenen Datei in Bytes fest.
props.HasMaxFiles.desc=Legt die maximale Anzahl hochladbarer Dateien fest.
props.HasMaxHeight.desc=Legt die maximale Höhe fest, auf die die Komponente wachsen kann.
props.HasMaxLength.desc=Legt die maximale Anzahl Zeichen fest, die die Komponente annimmt.
props.HasMaxWidth.desc=Legt die maximale Breite fest, auf die die Komponente wachsen kann.
props.HasMin.desc=Legt den kleinsten Wert fest, den die Komponente annimmt.
props.HasMinHeight.desc=Legt die minimale Höhe fest, auf die die Komponente schrumpfen kann.
props.HasMinLength.desc=Legt die minimale Anzahl Zeichen fest, die die Komponente verlangt.
props.HasMinWidth.desc=Legt die minimale Breite fest, auf die die Komponente schrumpfen kann.
props.HasPattern.desc=Legt einen regulären Ausdruck fest, dem der Wert der Komponente entsprechen muss, um gültig zu sein.
props.HasPlaceholder.desc=Legt den Platzhaltertext fest, der angezeigt wird, solange die Komponente keinen Wert hat.
props.HasReadOnly.desc=Verhindert das Ändern des Werts der Komponente, erlaubt aber weiterhin Fokus und Auswahl.
props.HasRequired.desc=Markiert die Komponente als Pflichtfeld für die Formularvalidierung.
props.HasStep.desc=Legt die Schrittweite fest, mit der sich der Wert ändert.
props.HasText.desc=Legt den Textinhalt fest, den die Komponente anzeigt.
props.HasTextPosition.desc=Legt fest, wo der Text relativ zum Icon oder Steuerelement der Komponente steht.
props.HasTheme.desc=Legt das Farb-Theme der Komponente fest.
props.HasTooltip.desc=Legt den Tooltip-Text fest, der beim Überfahren der Komponente erscheint.
props.HasVisibility.desc=Steuert, ob die Komponente sichtbar ist.
props.HasWidth.desc=Legt die Breite der Komponente fest.

props.Icon.desc=Legt das Icon fest, das die Komponente anzeigt, ausgewählt aus einem Icon-Pool.

props.IframeSrc.desc=Legt die URL der eingebetteten Seite fest.

props.ImgAlt.desc=Legt den Alternativtext fest, der ausgegeben wird, wenn das Bild nicht angezeigt werden kann.
props.ImgSrc.desc=Legt die URL des angezeigten Bildes fest.

props.LabelWrap.desc=Erlaubt, den Beschriftungstext auf mehrere Zeilen umzubrechen, statt ihn abzuschneiden.

props.ListBoxSelectionMode.desc=Legt fest, ob die Listbox die Auswahl eines einzelnen oder mehrerer Einträge erlaubt.

props.ListSearchEmptyMessage.desc=Legt die Meldung fest, die angezeigt wird, wenn eine Listensuche keine Treffer liefert.
props.ListSearchFieldVisible.desc=Zeigt das Suchfeld über der Liste.
props.ListSearchPlaceholder.desc=Legt den Platzhaltertext im Suchfeld der Liste fest.

props.LoadingBackdropVisible.desc=Zeigt ein abgedunkeltes Overlay hinter der Ladeanzeige.

props.LoginAutoClose.desc=Schließt den Anmeldedialog automatisch nach erfolgreicher Anmeldung.
props.LoginAutoSignin.desc=Versucht die Anmeldung automatisch, ohne dass das Formular abgeschickt werden muss.
props.LoginEmptyPassword.desc=Erlaubt, das Anmeldeformular mit leerem Passwortfeld abzuschicken.
props.LoginError.desc=Zeigt das Anmeldeformular in seinem Fehlerzustand.
props.LoginRememberme.desc=Zeigt im Anmeldeformular eine "remember me"-Option.

props.NavigatorAutoDisable.desc=Deaktiviert die Navigationsschaltflächen automatisch, sobald die erste oder letzte Seite erreicht ist.
props.NavigatorLayout.desc=Legt fest, welche Navigationselemente der Navigator rendert: none, numbered pages, preview oder quick jump.

props.PasswordFieldPasswordReveal.desc=Zeigt ein Steuerelement, mit dem sich das eingegebene Passwort einblenden lässt.

props.ProgressBarAnimated.desc=Animiert die Füllung des Fortschrittsbalkens.
props.ProgressBarIndeterminate.desc=Zeigt den Fortschrittsbalken im unbestimmten Zustand, wenn sich der Fortschritt nicht messen lässt.
props.ProgressBarOrientation.desc=Legt fest, ob der Fortschrittsbalken horizontal oder vertikal angeordnet ist.
props.ProgressBarStriped.desc=Zeigt ein Streifenmuster auf der Füllung des Fortschrittsbalkens.
props.ProgressBarTextVisible.desc=Zeigt den Fortschritt in Prozent als Text auf dem Fortschrittsbalken.

props.RadioButtonActivation.desc=Legt fest, ob der Radiobutton bei Fokus automatisch oder erst bei ausdrücklicher Auswahl aktiviert wird.
props.RadioButtonChecked.desc=Steuert, ob der Radiobutton ausgewählt ist.
props.RadioButtonSwitch.desc=Rendert den Radiobutton als Umschalter statt als Standard-Radiobutton.

props.SelectDropdownMaxRowCount.desc=Legt fest, wie viele Zeilen die geöffnete Dropdown-Liste zeigt, bevor sie scrollt.
props.SelectDropdownOpenHeight.desc=Legt die Höhe der Dropdown-Liste im geöffneten Zustand fest.
props.SelectDropdownOpenWidth.desc=Legt die Breite der Dropdown-Liste im geöffneten Zustand fest.

props.SliderAllowMajorLabelsOverlap.desc=Erlaubt, dass sich Beschriftungen der Hauptteilstriche überlappen, statt sie zur Vermeidung von Kollisionen auszublenden.
props.SliderFilled.desc=Füllt die Spur zwischen dem Anfang des Sliders und seinem aktuellen Wert.
props.SliderInverted.desc=Kehrt die Richtung um, in der der Wert des Sliders steigt.
props.SliderLabelsVisible.desc=Zeigt Beschriftungen neben den Teilstrichen des Sliders.
props.SliderMajorTickSpacing.desc=Legt fest, wie viele Werte zwischen den Hauptteilstrichen des Sliders liegen.
props.SliderMinorTickSpacing.desc=Legt fest, wie viele Werte zwischen den Nebenteilstrichen des Sliders liegen.
props.SliderOrientation.desc=Legt fest, ob der Slider horizontal oder vertikal angeordnet ist.
props.SliderSlideByClickingTicks.desc=Erlaubt, den Slider durch einen Klick direkt auf einen Teilstrich zu bewegen.
props.SliderSlideByWheel.desc=Erlaubt, den Wert des Sliders mit dem Mausrad zu ändern.
props.SliderSnapToTicks.desc=Rastet den Wert des Sliders am nächsten Teilstrich ein.
props.SliderTicksVisible.desc=Zeigt Teilstriche entlang der Spur des Sliders.
props.SliderTooltipVisible.desc=Zeigt während der Bedienung des Sliders einen Tooltip mit dem aktuellen Wert.
props.SliderTooltipVisibleOnSlideOnly.desc=Zeigt den Wert-Tooltip des Sliders nur während des aktiven Schiebens, nicht beim Überfahren.

props.SpinnerClockwise.desc=Setzt die Drehrichtung des Spinners auf im Uhrzeigersinn statt gegen den Uhrzeigersinn.
props.SpinnerPaused.desc=Pausiert die Animation des Spinners.
props.SpinnerSpeed.desc=Legt die Drehgeschwindigkeit des Spinners fest.

props.SplitterAutosave.desc=Speichert die Position des Splitters über Sitzungen hinweg.
props.SplitterOrientation.desc=Legt fest, ob der Splitter seine Bereiche horizontal oder vertikal teilt.
props.SplitterPositionRelative.desc=Legt die Position des Splitters als Prozentwert zwischen seinen beiden Bereichen fest.

props.TabbedPaneAlignment.desc=Legt die Ausrichtung der Tabs innerhalb der Tab-Leiste fest.
props.TabbedPaneBodyHidden.desc=Blendet den Inhaltsbereich aus, sodass sich die Komponente wie ein Tab-Menü verhält.
props.TabbedPaneBorderless.desc=Entfernt den Rahmen um das Tab-Panel.
props.TabbedPaneHideActiveIndicator.desc=Blendet die Markierung des aktiven Tabs aus.
props.TabbedPanePlacement.desc=Legt fest, an welcher Kante des Panels die Tabs sitzen.
props.TabbedPaneSegment.desc=Rendert die Tabs als segmentiertes, pillenförmiges Steuerelement statt als Standard-Tabs.
props.TabbedPaneSwipeWithMouse.desc=Erlaubt den Tab-Wechsel auch per Ziehen mit der Maus, nicht nur per Touch.
props.TabbedPaneSwipeable.desc=Erlaubt den Tab-Wechsel per Wischgeste.

props.TableCheckboxSelection.desc=Zeigt in jeder Zeile eine Checkbox zum Auswählen.
props.TableDeselection.desc=Erlaubt, eine bereits ausgewählte Zeile wieder abzuwählen.
props.TableGroupHeaderHeight.desc=Legt die Höhe der Gruppenkopfzeile der Tabelle fest.
props.TableHeaderCheckboxSelection.desc=Zeigt im Tabellenkopf eine Checkbox zum Aus- oder Abwählen aller Zeilen.
props.TableHeaderHeight.desc=Legt die Höhe der Kopfzeile der Tabelle fest.
props.TableMultiSelectWithClick.desc=Erlaubt die Auswahl mehrerer Zeilen mit einfachem Klick, ohne Zusatztaste.
props.TableMultiSorting.desc=Erlaubt, die Tabelle nach mehr als einer Spalte gleichzeitig zu sortieren.
props.TableRowHeight.desc=Legt die Höhe jeder Zeile in der Tabelle fest.
props.TableSelectionMode.desc=Legt fest, ob die Tabelle die Auswahl einer einzelnen oder mehrerer Zeilen erlaubt.
props.TableStriped.desc=Wechselt die Hintergrundfarbe der Tabellenzeilen ab.

props.TextAreaColumns.desc=Legt die sichtbare Breite des Textbereichs in Zeichen fest.
props.TextAreaHorizontalScroll.desc=Zeigt eine horizontale Bildlaufleiste im Textbereich.
props.TextAreaLineCountLimit.desc=Legt die maximale Anzahl Zeilen fest, die der Textbereich annimmt.
props.TextAreaLineWrap.desc=Bricht lange Textzeilen in die nächste Zeile um, statt horizontal zu scrollen.
props.TextAreaParagraphLengthLimit.desc=Legt die maximale Anzahl Zeichen in einem einzelnen Absatz fest.
props.TextAreaRows.desc=Legt die sichtbare Höhe des Textbereichs in Zeilen fest.
props.TextAreaVerticalScroll.desc=Zeigt eine vertikale Bildlaufleiste im Textbereich.
props.TextAreaWrapStyle.desc=Legt fest, ob umgebrochener Text an Wortgrenzen oder an Zeichengrenzen bricht.

props.TextFieldSpellCheck.desc=Aktiviert die Rechtschreibprüfung des Browsers für den Inhalt des Feldes.
props.TextFieldType.desc=Legt den Eingabetyp fest, den das Textfeld annimmt, etwa text, email oder password.

props.ToastDuration.desc=Legt fest, wie lange der Toast sichtbar bleibt, bevor er verschwindet.
props.ToastPlacement.desc=Legt fest, wo der Toast auf dem Bildschirm erscheint.

props.ToolbarCompact.desc=Verringert den Innenabstand der Toolbar für ein kompakteres Erscheinungsbild.

props.TreeConnected.desc=Zeigt Verbindungslinien zwischen Eltern- und Kindknoten im Baum.
props.TreeGroupIconsVisible.desc=Zeigt Icons neben Gruppenknoten (Elternknoten) im Baum.
props.TreeLeafIconsVisible.desc=Zeigt Icons neben Blattknoten (Knoten ohne Kinder) im Baum.
props.TreeSelectionMode.desc=Legt fest, ob der Baum die Auswahl eines einzelnen oder mehrerer Knoten erlaubt.

props.UploadAllFilesFilterEnabled.desc=Fügt dem Dateityp-Filtermenü des Uploads eine "all files"-Option hinzu.
props.UploadAutoClear.desc=Legt fest, wann abgeschlossene Dateien automatisch aus der Dateiliste des Uploads entfernt werden.
props.UploadAutoUpload.desc=Legt fest, wann Datei-Uploads automatisch starten: never, on selection oder on drop.
props.UploadCapture.desc=Legt fest, welche Kamera oder welches Mikrofon des Geräts der Upload dem Browser vorschlagen soll.
props.UploadPicker.desc=Legt fest, ob der Upload-Dialog einzelne Dateien oder ganze Verzeichnisse auswählt.
props.UploadPreset.desc=Legt fest, welche Upload-Steuerelemente sichtbar sind: full, inline oder button only.
props.UploadSelectionMode.desc=Legt fest, ob der Upload die Auswahl einer einzelnen oder mehrerer Dateien erlaubt.
