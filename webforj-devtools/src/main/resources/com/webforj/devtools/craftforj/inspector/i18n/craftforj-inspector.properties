# English descriptions for devtools inspector property contributions.
# Key format: props.<FeatureType>.desc
props.AccordionMultiple.desc=Allows more than one accordion panel to stay open at the same time.
props.AccordionPanelLabel.desc=Sets the text shown in the accordion panel's header.

props.AlertClosable.desc=Shows a close button that lets the user dismiss the alert.

props.AnchorHref.desc=Sets the URL the link navigates to.
props.AnchorTarget.desc=Sets where the linked URL opens, such as _self or _blank.

props.AppLayoutDrawerFooterVisible.desc=Shows the footer section inside the drawer.
props.AppLayoutDrawerHeaderVisible.desc=Shows the header section inside the drawer.
props.AppLayoutDrawerOpened.desc=Controls whether the drawer is currently open.
props.AppLayoutDrawerOverlay.desc=Renders the drawer as an overlay above the content instead of pushing it aside.
props.AppLayoutDrawerPlacement.desc=Sets which edge of the layout the drawer opens from.
props.AppLayoutDrawerPopover.desc=Renders the drawer as a floating popover instead of a docked panel.
props.AppLayoutFooterFixed.desc=Keeps the footer fixed in place while the content scrolls.
props.AppLayoutFooterOffscreen.desc=Moves the footer off-screen so it is hidden until revealed.
props.AppLayoutFooterReveal.desc=Reveals the footer automatically as the user scrolls.
props.AppLayoutFooterShadow.desc=Sets when the footer casts a shadow over the content: never, on scroll, or always.
props.AppLayoutHeaderFixed.desc=Keeps the header fixed in place while the content scrolls.
props.AppLayoutHeaderOffscreen.desc=Moves the header off-screen so it is hidden until revealed.
props.AppLayoutHeaderReveal.desc=Reveals the header automatically as the user scrolls.
props.AppLayoutHeaderShadow.desc=Sets when the header casts a shadow over the content: never, on scroll, or always.

props.AppNavAutoOpen.desc=Automatically opens the navigation group containing the active route.
props.AppNavItemPinKey.desc=Sets an explicit key used to persist this item's pin state across reloads.
props.AppNavItemPinned.desc=Controls whether this navigation item is pinned to the pinned section.
props.AppNavPinningAutosave.desc=Automatically persists pinned navigation items across sessions.
props.AppNavPinningEnabled.desc=Allows users to pin and unpin navigation items.
props.AppNavPinningTitle.desc=Sets the title shown above the pinned navigation section.
props.AppNavPinningTouchVisible.desc=Shows the pin control on touch devices.
props.AppNavSearchEmptyMessage.desc=Sets the message shown when a navigation search returns no results.
props.AppNavSearchFieldVisible.desc=Shows the search field in the navigation panel.
props.AppNavSearchPlaceholder.desc=Sets the placeholder text shown in the navigation search field.

props.AvatarInitials.desc=Sets the initials displayed when the avatar has no image.
props.AvatarShape.desc=Sets the outline shape of the avatar.

props.BadgeLabel.desc=Sets the text displayed inside the badge.

props.ButtonName.desc=Sets the accessible name used for the button when its label is icon-only.

props.CardBorderless.desc=Removes the frame ring drawn around the card.
props.CardDivided.desc=Draws dividers between the card's header, body and footer.
props.CardOrientation.desc=Sets whether the card's figure is stacked above the other regions or placed beside them.
props.CardShadow.desc=Sets the elevation shadow cast by the card.

props.CheckBoxChecked.desc=Controls whether the checkbox is checked.
props.CheckBoxIndeterminate.desc=Shows the checkbox in an indeterminate (partially checked) visual state.

props.ColumnsLayoutBreakpoints.desc=Sets the responsive breakpoints that control how many columns the layout renders at each width.
props.ColumnsLayoutHorizontalAlignment.desc=Sets how items are aligned horizontally within their columns.
props.ColumnsLayoutHorizontalSpacing.desc=Sets the horizontal gap between columns.
props.ColumnsLayoutItemColumn.desc=Sets which column this item is placed in.
props.ColumnsLayoutItemHorizontalAlignment.desc=Overrides the horizontal alignment of this item within its column.
props.ColumnsLayoutItemSpan.desc=Sets how many columns this item spans.
props.ColumnsLayoutItemVerticalAlignment.desc=Overrides the vertical alignment of this item within its column.
props.ColumnsLayoutVerticalAlignment.desc=Sets how items are aligned vertically within their columns.
props.ColumnsLayoutVerticalSpacing.desc=Sets the vertical gap between rows.

props.ComboBoxAllowCustomValue.desc=Allows the user to type a value that is not in the list of options.

props.DialogAlignment.desc=Sets where the dialog is positioned on the screen.
props.DialogAutoWidth.desc=Sizes the dialog width automatically to fit its content.
props.DialogBackdrop.desc=Shows a dimmed backdrop overlay behind the dialog while it is open.
props.DialogBlurred.desc=Blurs the content behind the dialog's backdrop.
props.DialogCancelOnEscKey.desc=Closes the dialog when the user presses the Escape key.
props.DialogCancelOnOutsideClick.desc=Closes the dialog when the user clicks outside of it.
props.DialogFullscreen.desc=Expands the dialog to fill the entire screen.
props.DialogMoveable.desc=Allows the user to drag the dialog to a new position.
props.DialogPosx.desc=Sets the horizontal position of the dialog.
props.DialogPosy.desc=Sets the vertical position of the dialog.
props.DialogSnapToEdge.desc=Snaps the dialog to the nearest screen edge when dragged close to it.

props.DrawerPlacement.desc=Sets which edge of the screen the drawer slides in from.

props.FlexItemAlignment.desc=Overrides how this item aligns itself on the cross axis of the flex layout.
props.FlexItemBasis.desc=Sets the initial main-axis size of this item before growing or shrinking.
props.FlexItemGrow.desc=Sets how much this item grows relative to its siblings to fill extra space.
props.FlexItemOrder.desc=Sets the visual order of this item relative to its siblings.
props.FlexItemShrink.desc=Sets how much this item shrinks relative to its siblings when space is limited.

props.FlexLayoutAlignContent.desc=Sets how wrapped rows or columns are distributed within the flex layout.
props.FlexLayoutAlignItems.desc=Sets how items are aligned on the cross axis of the flex layout.
props.FlexLayoutDirection.desc=Sets the main axis direction in which items are laid out.
props.FlexLayoutJustifyContent.desc=Sets how items are distributed along the main axis of the flex layout.
props.FlexLayoutSpacing.desc=Sets the gap between items in the flex layout.
props.FlexLayoutWrap.desc=Controls whether items wrap onto multiple lines when they run out of space.

props.HasClassName.desc=Adds CSS class names to the component's root element.
props.HasDisableOnClick.desc=Disables the component automatically right after it is clicked.
props.HasEnablement.desc=Enables or disables user interaction with the component.
props.HasExpanse.desc=Sets the size scale of the component, from smaller to larger.
props.HasFileChooserFiltersVisible.desc=Shows the file type filter menu in the file chooser.
props.HasFileChooserMultiFilterSelection.desc=Allows selecting multiple file type filters at once in the file chooser menu.
props.HasFileDrop.desc=Enables dropping files onto the component to upload them.
props.HasFileSystemAccess.desc=Allows the component to use the browser's File System Access API.
props.HasHeight.desc=Sets the height of the component.
props.HasHelperText.desc=Sets supporting helper text shown below the component.
props.HasHighlightOnFocus.desc=Sets when the component's contents are automatically highlighted on focus: never, on keyboard focus, or on any focus.
props.HasHorizontalAlignment.desc=Sets the horizontal alignment of the component's content.
props.HasLabel.desc=Sets the label text shown for the component.
props.HasMask.desc=Sets the input mask pattern that constrains and formats what the user can type.
props.HasMax.desc=Sets the maximum value the component accepts.
props.HasMaxFileSize.desc=Sets the maximum size, in bytes, allowed for an uploaded file.
props.HasMaxFiles.desc=Sets the maximum number of files that can be uploaded.
props.HasMaxHeight.desc=Sets the maximum height the component can grow to.
props.HasMaxLength.desc=Sets the maximum number of characters the component accepts.
props.HasMaxWidth.desc=Sets the maximum width the component can grow to.
props.HasMin.desc=Sets the minimum value the component accepts.
props.HasMinHeight.desc=Sets the minimum height the component can shrink to.
props.HasMinLength.desc=Sets the minimum number of characters the component requires.
props.HasMinWidth.desc=Sets the minimum width the component can shrink to.
props.HasPattern.desc=Sets a regular expression that the component's value must match to be valid.
props.HasPlaceholder.desc=Sets placeholder text shown when the component has no value.
props.HasReadOnly.desc=Prevents the user from changing the component's value while still allowing focus and selection.
props.HasRequired.desc=Marks the component as required for form validation.
props.HasStep.desc=Sets the increment step used when the value changes.
props.HasText.desc=Sets the text content displayed by the component.
props.HasTextPosition.desc=Sets where the text is positioned relative to the component's icon or control.
props.HasTheme.desc=Sets the color theme applied to the component.
props.HasTooltip.desc=Sets the tooltip text shown when hovering over the component.
props.HasVisibility.desc=Controls whether the component is visible.
props.HasWidth.desc=Sets the width of the component.

props.Icon.desc=Sets the icon displayed by the component, chosen from an icon pool.

props.IframeSrc.desc=Sets the URL of the embedded page.

props.ImgAlt.desc=Sets the alternative text announced when the image cannot be shown.
props.ImgSrc.desc=Sets the URL of the displayed image.

props.LabelWrap.desc=Allows the label's text to wrap onto multiple lines instead of truncating.

props.ListBoxSelectionMode.desc=Sets whether the list box allows selecting a single entry or multiple entries.

props.ListSearchEmptyMessage.desc=Sets the message shown when a list search returns no results.
props.ListSearchFieldVisible.desc=Shows the search field above the list.
props.ListSearchPlaceholder.desc=Sets the placeholder text shown in the list's search field.

props.LoadingBackdropVisible.desc=Shows a dimmed backdrop behind the loading indicator.

props.LoginAutoClose.desc=Closes the login dialog automatically after a successful sign-in.
props.LoginAutoSignin.desc=Attempts to sign in automatically without requiring the user to submit the form.
props.LoginEmptyPassword.desc=Allows the login form to be submitted with an empty password field.
props.LoginError.desc=Shows the login form in its error state.
props.LoginRememberme.desc=Shows a "remember me" option on the login form.

props.NavigatorAutoDisable.desc=Automatically disables navigation buttons when the boundary page is reached.
props.NavigatorLayout.desc=Sets which navigation controls the navigator renders: none, numbered pages, preview, or quick jump.

props.PasswordFieldPasswordReveal.desc=Shows a control that lets the user reveal the typed password.

props.ProgressBarAnimated.desc=Animates the progress bar's fill.
props.ProgressBarIndeterminate.desc=Shows the progress bar in an indeterminate state when progress cannot be measured.
props.ProgressBarOrientation.desc=Sets whether the progress bar is laid out horizontally or vertically.
props.ProgressBarStriped.desc=Shows a striped pattern on the progress bar's fill.
props.ProgressBarTextVisible.desc=Shows the progress percentage as text on the progress bar.

props.RadioButtonActivation.desc=Sets whether the radio button is checked automatically on focus or only on explicit selection.
props.RadioButtonChecked.desc=Controls whether the radio button is checked.
props.RadioButtonSwitch.desc=Renders the radio button as a toggle switch instead of the standard radio control.

props.SelectDropdownMaxRowCount.desc=Sets the maximum number of rows shown in the open dropdown list before it scrolls.
props.SelectDropdownOpenHeight.desc=Sets the height of the dropdown list panel when it is open.
props.SelectDropdownOpenWidth.desc=Sets the width of the dropdown list panel when it is open.

props.SliderAllowMajorLabelsOverlap.desc=Allows major tick labels to overlap instead of being hidden to avoid collisions.
props.SliderFilled.desc=Fills the track between the slider's start and its current value.
props.SliderInverted.desc=Reverses the direction in which the slider's value increases.
props.SliderLabelsVisible.desc=Shows labels next to the slider's tick marks.
props.SliderMajorTickSpacing.desc=Sets the number of values between major tick marks on the slider.
props.SliderMinorTickSpacing.desc=Sets the number of values between minor tick marks on the slider.
props.SliderOrientation.desc=Sets whether the slider is laid out horizontally or vertically.
props.SliderSlideByClickingTicks.desc=Allows the user to move the slider by clicking directly on a tick mark.
props.SliderSlideByWheel.desc=Allows the user to change the slider's value using the mouse wheel.
props.SliderSnapToTicks.desc=Snaps the slider's value to the nearest tick mark.
props.SliderTicksVisible.desc=Shows tick marks along the slider's track.
props.SliderTooltipVisible.desc=Shows a tooltip with the current value while interacting with the slider.
props.SliderTooltipVisibleOnSlideOnly.desc=Shows the slider's value tooltip only while actively sliding, not on hover.

props.SpinnerClockwise.desc=Sets the spinner's rotation direction to clockwise instead of counterclockwise.
props.SpinnerPaused.desc=Pauses the spinner's animation.
props.SpinnerSpeed.desc=Sets the speed of the spinner's rotation.

props.SplitterAutosave.desc=Persists the splitter's position across sessions.
props.SplitterOrientation.desc=Sets whether the splitter divides its panes horizontally or vertically.
props.SplitterPositionRelative.desc=Sets the splitter's position as a percentage between its two panes.

props.TabbedPaneAlignment.desc=Sets the alignment of the tabs within the tab bar.
props.TabbedPaneBodyHidden.desc=Hides the content body so the component behaves like a tab-based menu.
props.TabbedPaneBorderless.desc=Removes the border around the tabbed pane.
props.TabbedPaneHideActiveIndicator.desc=Hides the indicator that highlights the active tab.
props.TabbedPanePlacement.desc=Sets which edge of the pane the tabs are placed on.
props.TabbedPaneSegment.desc=Renders the tabs as a segmented, pill-shaped control instead of standard tabs.
props.TabbedPaneSwipeWithMouse.desc=Allows switching tabs by dragging with the mouse, not just touch.
props.TabbedPaneSwipeable.desc=Allows switching tabs with a swipe gesture.

props.TableCheckboxSelection.desc=Shows a checkbox in each row for selecting it.
props.TableDeselection.desc=Allows the user to deselect an already-selected row.
props.TableGroupHeaderHeight.desc=Sets the height of the table's group header row.
props.TableHeaderCheckboxSelection.desc=Shows a checkbox in the table header for selecting or deselecting all rows.
props.TableHeaderHeight.desc=Sets the height of the table's header row.
props.TableMultiSelectWithClick.desc=Allows selecting multiple rows with a plain click instead of requiring a modifier key.
props.TableMultiSorting.desc=Allows sorting the table by more than one column at a time.
props.TableRowHeight.desc=Sets the height of each row in the table.
props.TableSelectionMode.desc=Sets whether the table allows selecting a single row or multiple rows.
props.TableStriped.desc=Alternates the background color of table rows.

props.TextAreaColumns.desc=Sets the visible width of the text area in characters.
props.TextAreaHorizontalScroll.desc=Shows a horizontal scrollbar in the text area.
props.TextAreaLineCountLimit.desc=Sets the maximum number of lines the text area accepts.
props.TextAreaLineWrap.desc=Wraps long lines of text onto the next line instead of scrolling horizontally.
props.TextAreaParagraphLengthLimit.desc=Sets the maximum number of characters allowed in a single paragraph.
props.TextAreaRows.desc=Sets the visible height of the text area in rows.
props.TextAreaVerticalScroll.desc=Shows a vertical scrollbar in the text area.
props.TextAreaWrapStyle.desc=Sets whether wrapped text breaks at word boundaries or character boundaries.

props.TextFieldSpellCheck.desc=Enables the browser's spell checking on the field's content.
props.TextFieldType.desc=Sets the type of input the text field accepts, such as text, email, or password.

props.ToastDuration.desc=Sets how long the toast stays visible before it disappears.
props.ToastPlacement.desc=Sets where the toast appears on the screen.

props.ToolbarCompact.desc=Reduces the toolbar's padding for a more compact appearance.

props.TreeConnected.desc=Shows connecting lines between parent and child nodes in the tree.
props.TreeGroupIconsVisible.desc=Shows icons next to group (parent) nodes in the tree.
props.TreeLeafIconsVisible.desc=Shows icons next to leaf (childless) nodes in the tree.
props.TreeSelectionMode.desc=Sets whether the tree allows selecting a single node or multiple nodes.

props.UploadAllFilesFilterEnabled.desc=Adds an "all files" option to the upload's file type filter menu.
props.UploadAutoClear.desc=Sets when completed files are automatically removed from the upload's file list.
props.UploadAutoUpload.desc=Sets when file uploads start automatically: never, on selection, or on drop.
props.UploadCapture.desc=Sets which device camera or microphone the upload should hint the browser to use.
props.UploadPicker.desc=Sets whether the upload picker selects individual files or entire directories.
props.UploadPreset.desc=Sets which upload controls are visible: full, inline, or button only.
props.UploadSelectionMode.desc=Sets whether the upload allows selecting a single file or multiple files.
