# Descriptions françaises des contributions de propriétés de l'inspecteur devtools.
# Format des clés : props.<FeatureType>.desc
props.AccordionMultiple.desc=Permet à plusieurs panneaux de l'accordéon de rester ouverts en même temps.
props.AccordionPanelLabel.desc=Définit le texte affiché dans l'en-tête du panneau de l'accordéon.

props.AlertClosable.desc=Affiche un bouton de fermeture qui permet à l'utilisateur de masquer l'alerte.

props.AnchorHref.desc=Définit l'URL vers laquelle le lien navigue.
props.AnchorTarget.desc=Définit où l'URL du lien s'ouvre, par exemple _self ou _blank.

props.AppLayoutDrawerFooterVisible.desc=Affiche la section de pied de page à l'intérieur du tiroir.
props.AppLayoutDrawerHeaderVisible.desc=Affiche la section d'en-tête à l'intérieur du tiroir.
props.AppLayoutDrawerOpened.desc=Contrôle si le tiroir est actuellement ouvert.
props.AppLayoutDrawerOverlay.desc=Affiche le tiroir en superposition au-dessus du contenu au lieu de le décaler.
props.AppLayoutDrawerPlacement.desc=Définit le bord de la mise en page depuis lequel le tiroir s'ouvre.
props.AppLayoutDrawerPopover.desc=Affiche le tiroir comme une popover flottante au lieu d'un panneau ancré.
props.AppLayoutFooterFixed.desc=Maintient le pied de page fixe pendant que le contenu défile.
props.AppLayoutFooterOffscreen.desc=Déplace le pied de page hors de l'écran, où il reste masqué jusqu'à ce qu'il soit révélé.
props.AppLayoutFooterReveal.desc=Révèle automatiquement le pied de page à mesure que l'utilisateur fait défiler la page.
props.AppLayoutFooterShadow.desc=Définit quand le pied de page projette une ombre sur le contenu \: never, on scroll ou always.
props.AppLayoutHeaderFixed.desc=Maintient l'en-tête fixe pendant que le contenu défile.
props.AppLayoutHeaderOffscreen.desc=Déplace l'en-tête hors de l'écran, où il reste masqué jusqu'à ce qu'il soit révélé.
props.AppLayoutHeaderReveal.desc=Révèle automatiquement l'en-tête à mesure que l'utilisateur fait défiler la page.
props.AppLayoutHeaderShadow.desc=Définit quand l'en-tête projette une ombre sur le contenu \: never, on scroll ou always.

props.AppNavAutoOpen.desc=Ouvre automatiquement le groupe de navigation qui contient la route active.
props.AppNavItemPinKey.desc=Définit une clé explicite utilisée pour conserver l'état d'épinglage de cet élément d'un rechargement à l'autre.
props.AppNavItemPinned.desc=Contrôle si cet élément de navigation est épinglé dans la section des éléments épinglés.
props.AppNavPinningAutosave.desc=Conserve automatiquement les éléments de navigation épinglés d'une session à l'autre.
props.AppNavPinningEnabled.desc=Permet aux utilisateurs d'épingler et de désépingler des éléments de navigation.
props.AppNavPinningTitle.desc=Définit le titre affiché au-dessus de la section de navigation épinglée.
props.AppNavPinningTouchVisible.desc=Affiche le contrôle d'épinglage sur les appareils tactiles.
props.AppNavSearchEmptyMessage.desc=Définit le message affiché lorsqu'une recherche dans la navigation ne renvoie aucun résultat.
props.AppNavSearchFieldVisible.desc=Affiche le champ de recherche dans le panneau de navigation.
props.AppNavSearchPlaceholder.desc=Définit le texte indicatif affiché dans le champ de recherche de la navigation.

props.AvatarInitials.desc=Définit les initiales affichées lorsque l'avatar n'a pas d'image.
props.AvatarShape.desc=Définit la forme du contour de l'avatar.

props.BadgeLabel.desc=Définit le texte affiché à l'intérieur du badge.

props.ButtonDisableOnClick.desc=Désactive automatiquement le bouton juste après un clic.
props.ButtonName.desc=Définit le nom accessible utilisé pour le bouton lorsque son libellé se réduit à une icône.

props.CheckBoxChecked.desc=Contrôle si la case est cochée.
props.CheckBoxIndeterminate.desc=Affiche la case dans un état visuel indéterminé (partiellement cochée).

props.ColumnsLayoutBreakpoints.desc=Définit les points de rupture responsifs qui déterminent le nombre de colonnes rendues à chaque largeur.
props.ColumnsLayoutHorizontalAlignment.desc=Définit l'alignement horizontal des éléments dans leurs colonnes.
props.ColumnsLayoutHorizontalSpacing.desc=Définit l'espacement horizontal entre les colonnes.
props.ColumnsLayoutItemColumn.desc=Définit la colonne dans laquelle cet élément est placé.
props.ColumnsLayoutItemHorizontalAlignment.desc=Remplace l'alignement horizontal de cet élément dans sa colonne.
props.ColumnsLayoutItemSpan.desc=Définit le nombre de colonnes que cet élément occupe.
props.ColumnsLayoutItemVerticalAlignment.desc=Remplace l'alignement vertical de cet élément dans sa colonne.
props.ColumnsLayoutVerticalAlignment.desc=Définit l'alignement vertical des éléments dans leurs colonnes.
props.ColumnsLayoutVerticalSpacing.desc=Définit l'espacement vertical entre les lignes.

props.ComboBoxAllowCustomValue.desc=Permet à l'utilisateur de saisir une valeur qui ne figure pas dans la liste des options.

props.DialogAlignment.desc=Définit la position de la boîte de dialogue sur l'écran.
props.DialogAutoWidth.desc=Ajuste automatiquement la largeur de la boîte de dialogue à son contenu.
props.DialogBackdrop.desc=Affiche un fond assombri derrière la boîte de dialogue tant qu'elle est ouverte.
props.DialogBlurred.desc=Floute le contenu situé derrière le fond de la boîte de dialogue.
props.DialogCancelOnEscKey.desc=Ferme la boîte de dialogue lorsque l'utilisateur appuie sur la touche Échap.
props.DialogCancelOnOutsideClick.desc=Ferme la boîte de dialogue lorsque l'utilisateur clique en dehors de celle-ci.
props.DialogFullscreen.desc=Agrandit la boîte de dialogue pour qu'elle occupe tout l'écran.
props.DialogMoveable.desc=Permet à l'utilisateur de déplacer la boîte de dialogue par glisser-déposer.
props.DialogPosx.desc=Définit la position horizontale de la boîte de dialogue.
props.DialogPosy.desc=Définit la position verticale de la boîte de dialogue.
props.DialogSnapToEdge.desc=Aimante la boîte de dialogue au bord d'écran le plus proche lorsqu'on la fait glisser à proximité.

props.DrawerPlacement.desc=Définit le bord de l'écran depuis lequel le tiroir apparaît.

props.FlexItemAlignment.desc=Remplace l'alignement de cet élément sur l'axe transversal de la mise en page flex.
props.FlexItemBasis.desc=Définit la taille initiale de cet élément sur l'axe principal, avant agrandissement ou rétrécissement.
props.FlexItemGrow.desc=Définit dans quelle mesure cet élément s'agrandit, relativement à ses frères, pour occuper l'espace disponible.
props.FlexItemOrder.desc=Définit l'ordre visuel de cet élément par rapport à ses frères.
props.FlexItemShrink.desc=Définit dans quelle mesure cet élément se rétrécit, relativement à ses frères, quand l'espace est limité.

props.FlexLayoutAlignContent.desc=Définit la répartition des lignes ou colonnes passées à la ligne dans la mise en page flex.
props.FlexLayoutAlignItems.desc=Définit l'alignement des éléments sur l'axe transversal de la mise en page flex.
props.FlexLayoutDirection.desc=Définit la direction de l'axe principal selon lequel les éléments sont disposés.
props.FlexLayoutJustifyContent.desc=Définit la répartition des éléments le long de l'axe principal de la mise en page flex.
props.FlexLayoutSpacing.desc=Définit l'espacement entre les éléments de la mise en page flex.
props.FlexLayoutWrap.desc=Contrôle si les éléments passent sur plusieurs lignes lorsqu'ils manquent de place.

props.HasClassName.desc=Ajoute des noms de classes CSS à l'élément racine du composant.
props.HasEnablement.desc=Active ou désactive l'interaction de l'utilisateur avec le composant.
props.HasExpanse.desc=Définit l'échelle de taille du composant, du plus petit au plus grand.
props.HasFileChooserFiltersVisible.desc=Affiche le menu de filtres de types de fichiers dans le sélecteur de fichiers.
props.HasFileChooserMultiFilterSelection.desc=Permet de sélectionner plusieurs filtres de types de fichiers à la fois dans le menu du sélecteur de fichiers.
props.HasFileDrop.desc=Permet de déposer des fichiers sur le composant pour les téléverser.
props.HasFileSystemAccess.desc=Autorise le composant à utiliser l'API File System Access du navigateur.
props.HasHeight.desc=Définit la hauteur du composant.
props.HasHelperText.desc=Définit le texte d'aide affiché sous le composant.
props.HasHighlightOnFocus.desc=Définit quand le contenu du composant est automatiquement sélectionné à la prise de focus \: jamais, au focus clavier, ou à tout focus.
props.HasHorizontalAlignment.desc=Définit l'alignement horizontal du contenu du composant.
props.HasLabel.desc=Définit le texte du libellé affiché pour le composant.
props.HasMask.desc=Définit le masque de saisie qui contraint et formate ce que l'utilisateur peut taper.
props.HasMax.desc=Définit la valeur maximale acceptée par le composant.
props.HasMaxFileSize.desc=Définit la taille maximale, en octets, autorisée pour un fichier téléversé.
props.HasMaxFiles.desc=Définit le nombre maximal de fichiers pouvant être téléversés.
props.HasMaxHeight.desc=Définit la hauteur maximale que le composant peut atteindre.
props.HasMaxLength.desc=Définit le nombre maximal de caractères acceptés par le composant.
props.HasMaxWidth.desc=Définit la largeur maximale que le composant peut atteindre.
props.HasMin.desc=Définit la valeur minimale acceptée par le composant.
props.HasMinHeight.desc=Définit la hauteur minimale à laquelle le composant peut se réduire.
props.HasMinLength.desc=Définit le nombre minimal de caractères exigés par le composant.
props.HasMinWidth.desc=Définit la largeur minimale à laquelle le composant peut se réduire.
props.HasPattern.desc=Définit une expression régulière à laquelle la valeur du composant doit correspondre pour être valide.
props.HasPlaceholder.desc=Définit le texte indicatif affiché lorsque le composant n'a pas de valeur.
props.HasReadOnly.desc=Empêche l'utilisateur de modifier la valeur du composant tout en autorisant le focus et la sélection.
props.HasRequired.desc=Marque le composant comme obligatoire pour la validation du formulaire.
props.HasStep.desc=Définit le pas d'incrément utilisé lorsque la valeur change.
props.HasText.desc=Définit le contenu textuel affiché par le composant.
props.HasTextPosition.desc=Définit la position du texte par rapport à l'icône ou au contrôle du composant.
props.HasTheme.desc=Définit le thème de couleurs appliqué au composant.
props.HasTooltip.desc=Définit le texte de l'infobulle affichée au survol du composant.
props.HasVisibility.desc=Contrôle si le composant est visible.
props.HasWidth.desc=Définit la largeur du composant.

props.Icon.desc=Définit l'icône affichée par le composant, choisie dans un pool d'icônes.

props.IframeSrc.desc=Définit l'URL de la page intégrée.

props.ImgAlt.desc=Définit le texte alternatif annoncé lorsque l'image ne peut pas être affichée.
props.ImgSrc.desc=Définit l'URL de l'image affichée.

props.LabelWrap.desc=Permet au texte du libellé de passer sur plusieurs lignes au lieu d'être tronqué.

props.ListBoxSelectionMode.desc=Définit si la liste autorise la sélection d'une seule entrée ou de plusieurs entrées.

props.ListSearchEmptyMessage.desc=Définit le message affiché lorsqu'une recherche dans la liste ne renvoie aucun résultat.
props.ListSearchFieldVisible.desc=Affiche le champ de recherche au-dessus de la liste.
props.ListSearchPlaceholder.desc=Définit le texte indicatif affiché dans le champ de recherche de la liste.

props.LoadingBackdropVisible.desc=Affiche un fond assombri derrière l'indicateur de chargement.

props.LoginAutoClose.desc=Ferme automatiquement la boîte de dialogue de connexion après une authentification réussie.
props.LoginAutoSignin.desc=Tente de connecter l'utilisateur automatiquement, sans qu'il ait à soumettre le formulaire.
props.LoginEmptyPassword.desc=Autorise la soumission du formulaire de connexion avec un champ de mot de passe vide.
props.LoginError.desc=Affiche le formulaire de connexion dans son état d'erreur.
props.LoginRememberme.desc=Affiche une option « se souvenir de moi » sur le formulaire de connexion.

props.NavigatorAutoDisable.desc=Désactive automatiquement les boutons de navigation lorsque la page limite est atteinte.
props.NavigatorLayout.desc=Définit les contrôles de navigation rendus par le navigateur de pages \: aucun, pages numérotées, aperçu ou saut rapide.

props.PasswordFieldPasswordReveal.desc=Affiche un contrôle qui permet à l'utilisateur de révéler le mot de passe saisi.

props.ProgressBarAnimated.desc=Anime le remplissage de la barre de progression.
props.ProgressBarIndeterminate.desc=Affiche la barre de progression dans un état indéterminé lorsque la progression ne peut pas être mesurée.
props.ProgressBarOrientation.desc=Définit si la barre de progression est disposée horizontalement ou verticalement.
props.ProgressBarStriped.desc=Affiche un motif rayé sur le remplissage de la barre de progression.
props.ProgressBarTextVisible.desc=Affiche le pourcentage de progression sous forme de texte sur la barre de progression.

props.RadioButtonActivation.desc=Définit si le bouton radio est coché automatiquement à la prise de focus ou seulement sur sélection explicite.
props.RadioButtonChecked.desc=Contrôle si le bouton radio est coché.
props.RadioButtonSwitch.desc=Affiche le bouton radio sous forme d'interrupteur au lieu du contrôle radio standard.

props.SelectDropdownMaxRowCount.desc=Définit le nombre maximal de lignes affichées dans la liste déroulante ouverte avant qu'elle ne défile.
props.SelectDropdownOpenHeight.desc=Définit la hauteur du panneau de la liste déroulante lorsqu'il est ouvert.
props.SelectDropdownOpenWidth.desc=Définit la largeur du panneau de la liste déroulante lorsqu'il est ouvert.

props.SliderAllowMajorLabelsOverlap.desc=Autorise le chevauchement des libellés de graduations principales au lieu de les masquer pour éviter les collisions.
props.SliderFilled.desc=Remplit la piste entre le début du curseur et sa valeur actuelle.
props.SliderInverted.desc=Inverse le sens dans lequel la valeur du curseur augmente.
props.SliderLabelsVisible.desc=Affiche des libellés à côté des graduations du curseur.
props.SliderMajorTickSpacing.desc=Définit le nombre de valeurs entre deux graduations principales du curseur.
props.SliderMinorTickSpacing.desc=Définit le nombre de valeurs entre deux graduations secondaires du curseur.
props.SliderOrientation.desc=Définit si le curseur est disposé horizontalement ou verticalement.
props.SliderSlideByClickingTicks.desc=Permet à l'utilisateur de déplacer le curseur en cliquant directement sur une graduation.
props.SliderSlideByWheel.desc=Permet à l'utilisateur de modifier la valeur du curseur avec la molette de la souris.
props.SliderSnapToTicks.desc=Aimante la valeur du curseur à la graduation la plus proche.
props.SliderTicksVisible.desc=Affiche les graduations le long de la piste du curseur.
props.SliderTooltipVisible.desc=Affiche une infobulle avec la valeur actuelle pendant l'interaction avec le curseur.
props.SliderTooltipVisibleOnSlideOnly.desc=N'affiche l'infobulle de valeur du curseur que pendant le déplacement, pas au survol.

props.SpinnerClockwise.desc=Définit le sens de rotation du spinner dans le sens des aiguilles d'une montre plutôt que dans le sens inverse.
props.SpinnerPaused.desc=Met en pause l'animation du spinner.
props.SpinnerSpeed.desc=Définit la vitesse de rotation du spinner.

props.SplitterAutosave.desc=Conserve la position du séparateur d'une session à l'autre.
props.SplitterOrientation.desc=Définit si le séparateur divise ses volets horizontalement ou verticalement.
props.SplitterPositionRelative.desc=Définit la position du séparateur en pourcentage entre ses deux volets.

props.TabbedPaneAlignment.desc=Définit l'alignement des onglets dans la barre d'onglets.
props.TabbedPaneBodyHidden.desc=Masque le corps du contenu pour que le composant se comporte comme un menu à onglets.
props.TabbedPaneBorderless.desc=Supprime la bordure autour du panneau à onglets.
props.TabbedPaneHideActiveIndicator.desc=Masque l'indicateur qui met en évidence l'onglet actif.
props.TabbedPanePlacement.desc=Définit le bord du panneau sur lequel les onglets sont placés.
props.TabbedPaneSegment.desc=Affiche les onglets sous forme de contrôle segmenté en pilule au lieu d'onglets standards.
props.TabbedPaneSwipeWithMouse.desc=Permet de changer d'onglet en faisant glisser avec la souris, et pas seulement au toucher.
props.TabbedPaneSwipeable.desc=Permet de changer d'onglet d'un geste de balayage.

props.TableCheckboxSelection.desc=Affiche une case à cocher dans chaque ligne pour la sélectionner.
props.TableDeselection.desc=Permet à l'utilisateur de désélectionner une ligne déjà sélectionnée.
props.TableGroupHeaderHeight.desc=Définit la hauteur de la ligne d'en-tête de groupe du tableau.
props.TableHeaderCheckboxSelection.desc=Affiche une case à cocher dans l'en-tête du tableau pour sélectionner ou désélectionner toutes les lignes.
props.TableHeaderHeight.desc=Définit la hauteur de la ligne d'en-tête du tableau.
props.TableMultiSelectWithClick.desc=Permet de sélectionner plusieurs lignes d'un simple clic, sans avoir à utiliser une touche de modification.
props.TableMultiSorting.desc=Permet de trier le tableau sur plusieurs colonnes à la fois.
props.TableRowHeight.desc=Définit la hauteur de chaque ligne du tableau.
props.TableSelectionMode.desc=Définit si le tableau autorise la sélection d'une seule ligne ou de plusieurs lignes.
props.TableStriped.desc=Alterne la couleur de fond des lignes du tableau.

props.TextAreaColumns.desc=Définit la largeur visible de la zone de texte, en caractères.
props.TextAreaHorizontalScroll.desc=Affiche une barre de défilement horizontale dans la zone de texte.
props.TextAreaLineCountLimit.desc=Définit le nombre maximal de lignes acceptées par la zone de texte.
props.TextAreaLineWrap.desc=Renvoie les lignes longues à la ligne suivante au lieu de défiler horizontalement.
props.TextAreaParagraphLengthLimit.desc=Définit le nombre maximal de caractères autorisés dans un seul paragraphe.
props.TextAreaRows.desc=Définit la hauteur visible de la zone de texte, en lignes.
props.TextAreaVerticalScroll.desc=Affiche une barre de défilement verticale dans la zone de texte.
props.TextAreaWrapStyle.desc=Définit si le retour à la ligne se fait à la limite des mots ou à la limite des caractères.

props.TextFieldSpellCheck.desc=Active la correction orthographique du navigateur sur le contenu du champ.
props.TextFieldType.desc=Définit le type de saisie accepté par le champ de texte, par exemple text, email ou password.

props.ToastDuration.desc=Définit combien de temps le toast reste visible avant de disparaître.
props.ToastPlacement.desc=Définit où le toast apparaît sur l'écran.

props.ToolbarCompact.desc=Réduit le remplissage de la barre d'outils pour une apparence plus compacte.

props.TreeConnected.desc=Affiche des lignes de liaison entre les nœuds parents et enfants de l'arbre.
props.TreeGroupIconsVisible.desc=Affiche des icônes à côté des nœuds de groupe (parents) de l'arbre.
props.TreeLeafIconsVisible.desc=Affiche des icônes à côté des nœuds feuilles (sans enfant) de l'arbre.
props.TreeSelectionMode.desc=Définit si l'arbre autorise la sélection d'un seul nœud ou de plusieurs nœuds.

props.UploadAllFilesFilterEnabled.desc=Ajoute une option « tous les fichiers » au menu de filtres de types de fichiers du téléversement.
props.UploadAutoClear.desc=Définit quand les fichiers terminés sont automatiquement retirés de la liste des fichiers du téléversement.
props.UploadAutoUpload.desc=Définit quand les téléversements démarrent automatiquement \: jamais, à la sélection ou au dépôt.
props.UploadCapture.desc=Définit la caméra ou le microphone de l'appareil que le téléversement doit suggérer au navigateur.
props.UploadPicker.desc=Définit si le sélecteur de téléversement sélectionne des fichiers individuels ou des répertoires entiers.
props.UploadPreset.desc=Définit les contrôles de téléversement visibles \: complet, en ligne ou bouton seul.
props.UploadSelectionMode.desc=Définit si le téléversement autorise la sélection d'un seul fichier ou de plusieurs fichiers.
