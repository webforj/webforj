# Descripciones en español para las contribuciones de propiedades del inspector de devtools.
# Formato de clave: props.<FeatureType>.desc
props.AccordionMultiple.desc=Permite que más de un panel del acordeón permanezca abierto al mismo tiempo.
props.AccordionPanelLabel.desc=Define el texto que se muestra en la cabecera del panel del acordeón.

props.AlertClosable.desc=Muestra un botón de cierre que permite al usuario descartar la alerta.

props.AnchorHref.desc=Define la URL a la que navega el enlace.
props.AnchorTarget.desc=Define dónde se abre la URL enlazada, por ejemplo _self o _blank.

props.AppLayoutDrawerFooterVisible.desc=Muestra la sección de pie dentro del drawer.
props.AppLayoutDrawerHeaderVisible.desc=Muestra la sección de cabecera dentro del drawer.
props.AppLayoutDrawerOpened.desc=Controla si el drawer está abierto en este momento.
props.AppLayoutDrawerOverlay.desc=Renderiza el drawer como una capa sobre el contenido en lugar de desplazarlo a un lado.
props.AppLayoutDrawerPlacement.desc=Define desde qué borde del layout se abre el drawer.
props.AppLayoutDrawerPopover.desc=Renderiza el drawer como un popover flotante en lugar de un panel acoplado.
props.AppLayoutFooterFixed.desc=Mantiene el pie fijo en su sitio mientras el contenido se desplaza.
props.AppLayoutFooterOffscreen.desc=Desplaza el pie fuera de la pantalla para que quede oculto hasta que se revele.
props.AppLayoutFooterReveal.desc=Revela el pie automáticamente a medida que el usuario se desplaza.
props.AppLayoutFooterShadow.desc=Define cuándo el pie proyecta una sombra sobre el contenido: never, on scroll o always.
props.AppLayoutHeaderFixed.desc=Mantiene la cabecera fija en su sitio mientras el contenido se desplaza.
props.AppLayoutHeaderOffscreen.desc=Desplaza la cabecera fuera de la pantalla para que quede oculta hasta que se revele.
props.AppLayoutHeaderReveal.desc=Revela la cabecera automáticamente a medida que el usuario se desplaza.
props.AppLayoutHeaderShadow.desc=Define cuándo la cabecera proyecta una sombra sobre el contenido: never, on scroll o always.

props.AppNavAutoOpen.desc=Abre automáticamente el grupo de navegación que contiene la ruta activa.
props.AppNavItemPinKey.desc=Define una clave explícita usada para conservar el estado de anclaje de este elemento entre recargas.
props.AppNavItemPinned.desc=Controla si este elemento de navegación está anclado a la sección de anclados.
props.AppNavPinningAutosave.desc=Conserva automáticamente los elementos de navegación anclados entre sesiones.
props.AppNavPinningEnabled.desc=Permite a los usuarios anclar y desanclar elementos de navegación.
props.AppNavPinningTitle.desc=Define el título que se muestra sobre la sección de navegación anclada.
props.AppNavPinningTouchVisible.desc=Muestra el control de anclaje en dispositivos táctiles.
props.AppNavSearchEmptyMessage.desc=Define el mensaje que se muestra cuando una búsqueda en la navegación no devuelve resultados.
props.AppNavSearchFieldVisible.desc=Muestra el campo de búsqueda en el panel de navegación.
props.AppNavSearchPlaceholder.desc=Define el texto de marcador que se muestra en el campo de búsqueda de la navegación.

props.AvatarInitials.desc=Define las iniciales que se muestran cuando el avatar no tiene imagen.
props.AvatarShape.desc=Define la forma del contorno del avatar.

props.BadgeLabel.desc=Define el texto que se muestra dentro del badge.

props.ButtonDisableOnClick.desc=Desactiva el botón automáticamente justo después de hacer clic en él.
props.ButtonName.desc=Define el nombre accesible que se usa para el botón cuando su etiqueta es solo un icono.

props.CheckBoxChecked.desc=Controla si la casilla está marcada.
props.CheckBoxIndeterminate.desc=Muestra la casilla en un estado visual indeterminado (parcialmente marcada).

props.ColumnsLayoutBreakpoints.desc=Define los breakpoints adaptables que controlan cuántas columnas renderiza el layout en cada ancho.
props.ColumnsLayoutHorizontalAlignment.desc=Define cómo se alinean horizontalmente los elementos dentro de sus columnas.
props.ColumnsLayoutHorizontalSpacing.desc=Define el espacio horizontal entre columnas.
props.ColumnsLayoutItemColumn.desc=Define en qué columna se coloca este elemento.
props.ColumnsLayoutItemHorizontalAlignment.desc=Sobrescribe la alineación horizontal de este elemento dentro de su columna.
props.ColumnsLayoutItemSpan.desc=Define cuántas columnas abarca este elemento.
props.ColumnsLayoutItemVerticalAlignment.desc=Sobrescribe la alineación vertical de este elemento dentro de su columna.
props.ColumnsLayoutVerticalAlignment.desc=Define cómo se alinean verticalmente los elementos dentro de sus columnas.
props.ColumnsLayoutVerticalSpacing.desc=Define el espacio vertical entre filas.

props.ComboBoxAllowCustomValue.desc=Permite al usuario escribir un valor que no está en la lista de opciones.

props.DialogAlignment.desc=Define en qué posición de la pantalla se sitúa el diálogo.
props.DialogAutoWidth.desc=Ajusta automáticamente el ancho del diálogo a su contenido.
props.DialogBackdrop.desc=Muestra un fondo atenuado detrás del diálogo mientras está abierto.
props.DialogBlurred.desc=Desenfoca el contenido que hay detrás del fondo del diálogo.
props.DialogCancelOnEscKey.desc=Cierra el diálogo cuando el usuario pulsa la tecla Escape.
props.DialogCancelOnOutsideClick.desc=Cierra el diálogo cuando el usuario hace clic fuera de él.
props.DialogFullscreen.desc=Expande el diálogo hasta ocupar toda la pantalla.
props.DialogMoveable.desc=Permite al usuario arrastrar el diálogo a una nueva posición.
props.DialogPosx.desc=Define la posición horizontal del diálogo.
props.DialogPosy.desc=Define la posición vertical del diálogo.
props.DialogSnapToEdge.desc=Ajusta el diálogo al borde de pantalla más cercano cuando se arrastra junto a él.

props.DrawerPlacement.desc=Define desde qué borde de la pantalla se despliega el drawer.

props.FlexItemAlignment.desc=Sobrescribe cómo se alinea este elemento en el eje transversal del layout flex.
props.FlexItemBasis.desc=Define el tamaño inicial de este elemento en el eje principal antes de crecer o encoger.
props.FlexItemGrow.desc=Define cuánto crece este elemento respecto a sus hermanos para ocupar el espacio sobrante.
props.FlexItemOrder.desc=Define el orden visual de este elemento respecto a sus hermanos.
props.FlexItemShrink.desc=Define cuánto encoge este elemento respecto a sus hermanos cuando el espacio es limitado.

props.FlexLayoutAlignContent.desc=Define cómo se distribuyen las filas o columnas ajustadas dentro del layout flex.
props.FlexLayoutAlignItems.desc=Define cómo se alinean los elementos en el eje transversal del layout flex.
props.FlexLayoutDirection.desc=Define la dirección del eje principal en la que se disponen los elementos.
props.FlexLayoutJustifyContent.desc=Define cómo se distribuyen los elementos a lo largo del eje principal del layout flex.
props.FlexLayoutSpacing.desc=Define el espacio entre los elementos del layout flex.
props.FlexLayoutWrap.desc=Controla si los elementos pasan a varias líneas cuando se quedan sin espacio.

props.HasClassName.desc=Añade nombres de clase CSS al elemento raíz del componente.
props.HasEnablement.desc=Activa o desactiva la interacción del usuario con el componente.
props.HasExpanse.desc=Define la escala de tamaño del componente, de menor a mayor.
props.HasFileChooserFiltersVisible.desc=Muestra el menú de filtros por tipo de archivo en el selector de archivos.
props.HasFileChooserMultiFilterSelection.desc=Permite seleccionar varios filtros de tipo de archivo a la vez en el menú del selector de archivos.
props.HasFileDrop.desc=Permite soltar archivos sobre el componente para subirlos.
props.HasFileSystemAccess.desc=Permite que el componente use la File System Access API del navegador.
props.HasHeight.desc=Define la altura del componente.
props.HasHelperText.desc=Define el texto de ayuda que se muestra debajo del componente.
props.HasHighlightOnFocus.desc=Define cuándo se resalta automáticamente el contenido del componente al recibir el foco: never, on keyboard focus o on any focus.
props.HasHorizontalAlignment.desc=Define la alineación horizontal del contenido del componente.
props.HasLabel.desc=Define el texto de la etiqueta que se muestra para el componente.
props.HasMask.desc=Define el patrón de máscara de entrada que restringe y formatea lo que el usuario puede escribir.
props.HasMax.desc=Define el valor máximo que acepta el componente.
props.HasMaxFileSize.desc=Define el tamaño máximo, en bytes, permitido para un archivo subido.
props.HasMaxFiles.desc=Define el número máximo de archivos que se pueden subir.
props.HasMaxHeight.desc=Define la altura máxima hasta la que puede crecer el componente.
props.HasMaxLength.desc=Define el número máximo de caracteres que acepta el componente.
props.HasMaxWidth.desc=Define el ancho máximo hasta el que puede crecer el componente.
props.HasMin.desc=Define el valor mínimo que acepta el componente.
props.HasMinHeight.desc=Define la altura mínima hasta la que puede encoger el componente.
props.HasMinLength.desc=Define el número mínimo de caracteres que exige el componente.
props.HasMinWidth.desc=Define el ancho mínimo hasta el que puede encoger el componente.
props.HasPattern.desc=Define una expresión regular con la que debe coincidir el valor del componente para ser válido.
props.HasPlaceholder.desc=Define el texto de marcador que se muestra cuando el componente no tiene valor.
props.HasReadOnly.desc=Impide que el usuario cambie el valor del componente, permitiendo aún el foco y la selección.
props.HasRequired.desc=Marca el componente como obligatorio para la validación del formulario.
props.HasStep.desc=Define el incremento que se usa cuando cambia el valor.
props.HasText.desc=Define el contenido de texto que muestra el componente.
props.HasTextPosition.desc=Define dónde se sitúa el texto respecto al icono o al control del componente.
props.HasTheme.desc=Define el tema de color aplicado al componente.
props.HasTooltip.desc=Define el texto del tooltip que se muestra al pasar el cursor sobre el componente.
props.HasVisibility.desc=Controla si el componente es visible.
props.HasWidth.desc=Define el ancho del componente.

props.Icon.desc=Define el icono que muestra el componente, elegido de un pool de iconos.

props.IframeSrc.desc=Define la URL de la página incrustada.

props.ImgAlt.desc=Define el texto alternativo que se anuncia cuando la imagen no se puede mostrar.
props.ImgSrc.desc=Define la URL de la imagen mostrada.

props.LabelWrap.desc=Permite que el texto de la etiqueta pase a varias líneas en lugar de truncarse.

props.ListBoxSelectionMode.desc=Define si el list box permite seleccionar una sola entrada o varias.

props.ListSearchEmptyMessage.desc=Define el mensaje que se muestra cuando una búsqueda en la lista no devuelve resultados.
props.ListSearchFieldVisible.desc=Muestra el campo de búsqueda sobre la lista.
props.ListSearchPlaceholder.desc=Define el texto de marcador que se muestra en el campo de búsqueda de la lista.

props.LoadingBackdropVisible.desc=Muestra un fondo atenuado detrás del indicador de carga.

props.LoginAutoClose.desc=Cierra el diálogo de inicio de sesión automáticamente tras un acceso correcto.
props.LoginAutoSignin.desc=Intenta iniciar sesión automáticamente sin que el usuario tenga que enviar el formulario.
props.LoginEmptyPassword.desc=Permite enviar el formulario de inicio de sesión con el campo de contraseña vacío.
props.LoginError.desc=Muestra el formulario de inicio de sesión en su estado de error.
props.LoginRememberme.desc=Muestra una opción de "recordarme" en el formulario de inicio de sesión.

props.NavigatorAutoDisable.desc=Desactiva automáticamente los botones de navegación cuando se alcanza la página límite.
props.NavigatorLayout.desc=Define qué controles de navegación renderiza el navegador: none, numbered pages, preview o quick jump.

props.PasswordFieldPasswordReveal.desc=Muestra un control que permite al usuario revelar la contraseña escrita.

props.ProgressBarAnimated.desc=Anima el relleno de la barra de progreso.
props.ProgressBarIndeterminate.desc=Muestra la barra de progreso en estado indeterminado cuando el progreso no se puede medir.
props.ProgressBarOrientation.desc=Define si la barra de progreso se dispone horizontal o verticalmente.
props.ProgressBarStriped.desc=Muestra un patrón de rayas en el relleno de la barra de progreso.
props.ProgressBarTextVisible.desc=Muestra el porcentaje de progreso como texto sobre la barra de progreso.

props.RadioButtonActivation.desc=Define si el radio button se marca automáticamente al recibir el foco o solo con una selección explícita.
props.RadioButtonChecked.desc=Controla si el radio button está marcado.
props.RadioButtonSwitch.desc=Renderiza el radio button como un interruptor en lugar del control de radio estándar.

props.SelectDropdownMaxRowCount.desc=Define el número máximo de filas que se muestran en la lista desplegable abierta antes de que se desplace.
props.SelectDropdownOpenHeight.desc=Define la altura del panel de la lista desplegable cuando está abierto.
props.SelectDropdownOpenWidth.desc=Define el ancho del panel de la lista desplegable cuando está abierto.

props.SliderAllowMajorLabelsOverlap.desc=Permite que las etiquetas de las marcas principales se solapen en lugar de ocultarse para evitar colisiones.
props.SliderFilled.desc=Rellena la pista entre el inicio del slider y su valor actual.
props.SliderInverted.desc=Invierte la dirección en la que aumenta el valor del slider.
props.SliderLabelsVisible.desc=Muestra etiquetas junto a las marcas del slider.
props.SliderMajorTickSpacing.desc=Define el número de valores entre las marcas principales del slider.
props.SliderMinorTickSpacing.desc=Define el número de valores entre las marcas secundarias del slider.
props.SliderOrientation.desc=Define si el slider se dispone horizontal o verticalmente.
props.SliderSlideByClickingTicks.desc=Permite al usuario mover el slider haciendo clic directamente sobre una marca.
props.SliderSlideByWheel.desc=Permite al usuario cambiar el valor del slider con la rueda del ratón.
props.SliderSnapToTicks.desc=Ajusta el valor del slider a la marca más cercana.
props.SliderTicksVisible.desc=Muestra las marcas a lo largo de la pista del slider.
props.SliderTooltipVisible.desc=Muestra un tooltip con el valor actual mientras se interactúa con el slider.
props.SliderTooltipVisibleOnSlideOnly.desc=Muestra el tooltip de valor del slider solo mientras se desliza activamente, no al pasar el cursor.

props.SpinnerClockwise.desc=Define el sentido de giro del spinner como horario en lugar de antihorario.
props.SpinnerPaused.desc=Pausa la animación del spinner.
props.SpinnerSpeed.desc=Define la velocidad de giro del spinner.

props.SplitterAutosave.desc=Conserva la posición del splitter entre sesiones.
props.SplitterOrientation.desc=Define si el splitter divide sus paneles horizontal o verticalmente.
props.SplitterPositionRelative.desc=Define la posición del splitter como un porcentaje entre sus dos paneles.

props.TabbedPaneAlignment.desc=Define la alineación de las pestañas dentro de la barra de pestañas.
props.TabbedPaneBodyHidden.desc=Oculta el cuerpo del contenido para que el componente se comporte como un menú de pestañas.
props.TabbedPaneBorderless.desc=Elimina el borde alrededor del panel de pestañas.
props.TabbedPaneHideActiveIndicator.desc=Oculta el indicador que resalta la pestaña activa.
props.TabbedPanePlacement.desc=Define en qué borde del panel se colocan las pestañas.
props.TabbedPaneSegment.desc=Renderiza las pestañas como un control segmentado con forma de píldora en lugar de pestañas estándar.
props.TabbedPaneSwipeWithMouse.desc=Permite cambiar de pestaña arrastrando con el ratón, no solo con gestos táctiles.
props.TabbedPaneSwipeable.desc=Permite cambiar de pestaña con un gesto de deslizamiento.

props.TableCheckboxSelection.desc=Muestra una casilla en cada fila para seleccionarla.
props.TableDeselection.desc=Permite al usuario deseleccionar una fila ya seleccionada.
props.TableGroupHeaderHeight.desc=Define la altura de la fila de cabecera de grupo de la tabla.
props.TableHeaderCheckboxSelection.desc=Muestra una casilla en la cabecera de la tabla para seleccionar o deseleccionar todas las filas.
props.TableHeaderHeight.desc=Define la altura de la fila de cabecera de la tabla.
props.TableMultiSelectWithClick.desc=Permite seleccionar varias filas con un clic simple en lugar de exigir una tecla modificadora.
props.TableMultiSorting.desc=Permite ordenar la tabla por más de una columna a la vez.
props.TableRowHeight.desc=Define la altura de cada fila de la tabla.
props.TableSelectionMode.desc=Define si la tabla permite seleccionar una sola fila o varias.
props.TableStriped.desc=Alterna el color de fondo de las filas de la tabla.

props.TextAreaColumns.desc=Define el ancho visible del área de texto en caracteres.
props.TextAreaHorizontalScroll.desc=Muestra una barra de desplazamiento horizontal en el área de texto.
props.TextAreaLineCountLimit.desc=Define el número máximo de líneas que acepta el área de texto.
props.TextAreaLineWrap.desc=Ajusta las líneas largas de texto a la línea siguiente en lugar de desplazarse horizontalmente.
props.TextAreaParagraphLengthLimit.desc=Define el número máximo de caracteres permitidos en un solo párrafo.
props.TextAreaRows.desc=Define la altura visible del área de texto en filas.
props.TextAreaVerticalScroll.desc=Muestra una barra de desplazamiento vertical en el área de texto.
props.TextAreaWrapStyle.desc=Define si el texto ajustado se corta en los límites de palabra o de carácter.

props.TextFieldSpellCheck.desc=Activa la corrección ortográfica del navegador sobre el contenido del campo.
props.TextFieldType.desc=Define el tipo de entrada que acepta el campo de texto, por ejemplo text, email o password.

props.ToastDuration.desc=Define cuánto tiempo permanece visible el toast antes de desaparecer.
props.ToastPlacement.desc=Define en qué punto de la pantalla aparece el toast.

props.ToolbarCompact.desc=Reduce el relleno de la barra de herramientas para un aspecto más compacto.

props.TreeConnected.desc=Muestra líneas de conexión entre los nodos padre e hijo del árbol.
props.TreeGroupIconsVisible.desc=Muestra iconos junto a los nodos de grupo (padres) del árbol.
props.TreeLeafIconsVisible.desc=Muestra iconos junto a los nodos hoja (sin hijos) del árbol.
props.TreeSelectionMode.desc=Define si el árbol permite seleccionar un solo nodo o varios.

props.UploadAllFilesFilterEnabled.desc=Añade una opción de "todos los archivos" al menú de filtros por tipo de archivo de la subida.
props.UploadAutoClear.desc=Define cuándo se eliminan automáticamente los archivos completados de la lista de la subida.
props.UploadAutoUpload.desc=Define cuándo comienzan automáticamente las subidas de archivos: never, on selection o on drop.
props.UploadCapture.desc=Define qué cámara o micrófono del dispositivo debe sugerir la subida al navegador.
props.UploadPicker.desc=Define si el selector de la subida elige archivos individuales o directorios completos.
props.UploadPreset.desc=Define qué controles de la subida son visibles: full, inline o button only.
props.UploadSelectionMode.desc=Define si la subida permite seleccionar un solo archivo o varios.
